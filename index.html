/* ---------- helpers: build DOM, never inject user text as HTML ---------- */
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if(v===null||v===undefined||v===false) return;
    if(k==="class") n.className=v;
    else if(k==="text") n.textContent=v;
    else if(k==="html") n.innerHTML=v;           /* only ever used with static strings below */
    else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2),v);
    else n.setAttribute(k, v===true?"":v);
  });
  (kids||[]).forEach(function(c){ if(c==null) return; n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return n;
}

}

/* ---------- Supabase REST (publishable key; only 3 RPCs + settings read) ---------- */
function api(path, opts){
  opts = opts||{};
  var h = {"apikey":CFG.SUPABASE_KEY,"Content-Type":"application/json"};
  return fetch(CFG.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/"+path,{
    method:opts.method||"GET", headers:h, body:opts.body?JSON.stringify(opts.body):undefined, cache:"no-store", credentials:"omit"
  }).then(function(r){
    return r.text().then(function(t){
      var j=null; try{j=t?JSON.parse(t):null}catch(e){}
      if(!r.ok) throw new Error((j&&j.message)||("Request failed ("+r.status+")"));
      return j;
    });
  });
}
function rpc(name, args){ return api("rpc/"+name,{method:"POST",body:args}); }
function configured(){ return CFG.SUPABASE_URL && CFG.SUPABASE_KEY && CFG.SUPABASE_KEY.indexOf("PASTE")<0; }

var settingsCache=null;
function loadSettings(){

  if(!configured()) return Promise.resolve({});

    .catch(function(){ return null; });
}

  custom_builds:'<svg viewBox="0 0 24 24"><path d="M12 3l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 8.3l5-.7z"/></svg>',

function pageContact(){

  f.appendChild(head("Contact","Find us and get in touch."));

    loading.remove();
    if(s===null){ box.appendChild(el("div",{class:"card"},[el("p",{class:"notice bad",text:"Garage details couldn't be loaded right now. Please try again shortly."})])); return; }
    function row(title,val,link){
      var body=link?el("a",{href:link,rel:"noopener noreferrer",target:"_blank",text:val}):el("p",{text:val,style:"white-space:pre-line;margin:0"});

    if(!any) box.appendChild(el("div",{class:"card"},[el("h3",{text:"Details coming soon",style:"font-size:26px;margin-bottom:10px"}),el("p",{class:"muted",text:"The garage hasn't published its location or opening hours yet. In the meantime, send a booking request and we'll respond to you directly."}),el("a",{class:"btn sm",href:"#book",text:"Book a service"})]));

/* ---------- booking ---------- */
var submitting=false;
function newKey(){
  var a=new Uint8Array(16); (window.crypto||window.msCrypto).getRandomValues(a);
  return Array.prototype.map.call(a,function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
}
function localInputMin(){
  var d=new Date(Date.now()+15*60000); d.setSeconds(0,0);
  var p=function(n){return ("0"+n).slice(-2)};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());
}
function field(id,label,node,opt,hint){
  return el("div",null,[
    el("label",{for:id},[label,opt?el("span",{class:"opt",text:" (optional)"}):null]),
    node, hint?el("p",{class:"hint",text:hint,id:id+"-h"}):null, el("p",{class:"err",id:id+"-e",role:"alert"})
  ]);
}
function pageBook(q){
  var f=document.createDocumentFragment();
  f.appendChild(head("Book a service","Send a private request. Nothing is confirmed until management approves it."));
  if(!configured()){ f.appendChild(el("p",{class:"notice bad",text:"Booking isn't available yet: the website hasn't been connected to its booking service."})); return f; }

  var key=newKey();
  var card=el("div",{class:"card"});
  var form=el("form",{novalidate:true,autocomplete:"off"});
  var sel=el("select",{id:"f-service",name:"service_type",required:true},
    [el("option",{value:"",text:"Choose…"})].concat(Object.keys(SVC).map(function(k){return el("option",{value:k,text:SVC[k]})})));
  if(q.service&&SVC[q.service]) sel.value=q.service;
  var I={
    name:el("input",{id:"f-name",name:"character_name",maxlength:"60",required:true,autocomplete:"off"}),
    contact:el("input",{id:"f-contact",name:"contact",maxlength:"120",required:true,autocomplete:"off","aria-describedby":"f-contact-h"}),
    vehicle:el("input",{id:"f-vehicle",name:"vehicle",maxlength:"80",required:true,autocomplete:"off",placeholder:"e.g. Karin Sultan"}),
    reg:el("input",{id:"f-reg",name:"vehicle_reg",maxlength:"16",autocomplete:"off"}),
    service:sel,
    when:el("input",{id:"f-when",name:"preferred_at",type:"datetime-local",required:true,min:localInputMin()}),
    desc:el("textarea",{id:"f-desc",name:"description",maxlength:"2000",required:true})
  };
  var hp=el("div",{class:"hp","aria-hidden":"true"},[el("label",{for:"f-web",text:"Leave this empty"}),el("input",{id:"f-web",name:"website",tabindex:"-1",autocomplete:"off"})]);
  var msg=el("div",{id:"formMsg",role:"alert"});
  var btn=el("button",{class:"btn",type:"submit",text:"Send request"});

  form.appendChild(el("div",{class:"row2"},[
    field("f-name","Character name",I.name),
    field("f-contact","Contact information",I.contact,false,"In-character: phone number, email or other way to reach you.")]));
  form.appendChild(el("div",{class:"row2"},[
    field("f-vehicle","Vehicle make and model",I.vehicle),
    field("f-reg","Vehicle registration",I.reg,true)]));
  form.appendChild(el("div",{class:"row2"},[
    field("f-service","Type of service",I.service),
    field("f-when","Preferred date and time",I.when,false,"Your local time. This is a request, not a guaranteed slot.")]));
  form.appendChild(field("f-desc","Description of the work required",I.desc,false,"10 to 2000 characters."));
  form.appendChild(hp); form.appendChild(msg);
  form.appendChild(el("div",{class:"sp"},[btn]));
  card.appendChild(form); f.appendChild(card);

  var map={name:["f-name","Enter your character name (2 to 60 characters)."],contact:["f-contact","Enter in-character contact details (3 to 120 characters)."],
    vehicle:["f-vehicle","Enter the vehicle make and model (2 to 80 characters)."],service:["f-service","Choose a type of service."],
    when:["f-when","Choose a future date and time."],desc:["f-desc","Describe the work required (10 to 2000 characters)."],reg:["f-reg","Registration is too long (16 characters maximum)."]};
  var codeMap={invalid_name:"name",invalid_contact:"contact",invalid_vehicle:"vehicle",invalid_reg:"reg",invalid_service:"service",invalid_description:"desc",invalid_date:"when"};
  function setErr(k,text){
    var inp=I[k], e=$("#"+map[k][0]+"-e"); if(!inp||!e) return;
    e.textContent=text||""; if(text) inp.setAttribute("aria-invalid","true"); else inp.removeAttribute("aria-invalid");
  }
  function clean(s){return String(s).replace(/\s+/g," ").trim()}
  function validate(){
    var bad=[], v={
      name:clean(I.name.value), contact:clean(I.contact.value), vehicle:clean(I.vehicle.value),
      reg:clean(I.reg.value), service:I.service.value, desc:I.desc.value.trim()
    };
    Object.keys(map).forEach(function(k){setErr(k,"")});
    if(v.name.length<2||v.name.length>60) bad.push("name");
    if(v.contact.length<3||v.contact.length>120) bad.push("contact");
    if(v.vehicle.length<2||v.vehicle.length>80) bad.push("vehicle");
    if(v.reg.length>16) bad.push("reg");
    if(!SVC[v.service]) bad.push("service");
    var t=I.when.value?new Date(I.when.value):null;
    if(!t||isNaN(t)||t.getTime()<=Date.now()) bad.push("when");
    if(v.desc.length<10||v.desc.length>2000) bad.push("desc");
    bad.forEach(function(k){setErr(k,map[k][1])});
    if(bad.length){ I[bad[0]].focus(); return null; }
    return {character_name:v.name,contact:v.contact,vehicle:v.vehicle,vehicle_reg:v.reg,service_type:v.service,
            preferred_at:t.toISOString(),description:v.desc,idempotency_key:key,website:$("#f-web").value};
  }
  form.addEventListener("submit",function(ev){
    ev.preventDefault();
    if(submitting) return;                    /* blocks double-clicks */
    msg.textContent=""; msg.className="";
    var payload=validate(); if(!payload) return;
    submitting=true; btn.disabled=true; btn.textContent="Sending…";
    rpc("submit_booking",{p:payload}).then(function(r){
      if(r&&r.ok){ showReceipt(card,r); return; }
      var k=r&&codeMap[r.error];
      if(k){ setErr(k,r.message); I[k].focus(); }
      else { msg.className="notice bad"; msg.textContent=(r&&r.message)||"We couldn't send your request. Please try again."; }
    }).catch(function(){
      msg.className="notice bad";
      msg.textContent="We couldn't reach the booking service. Your request has not been lost if you retry: pressing Send again will not create a duplicate.";
    }).then(function(){ submitting=false; btn.disabled=false; btn.textContent="Send request"; });
  });
  return f;
}
function trackLink(ref,code){
  return location.href.split("#")[0]+"#track?ref="+encodeURIComponent(ref)+"&code="+encodeURIComponent(code);
}
function copyBtn(text,label){
  return el("button",{class:"btn sm alt",type:"button",text:label,onclick:function(){
    (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(function(){toast("Copied")},function(){toast("Select the text and copy it manually")});
  }});
}
function showReceipt(card,r){
  card.textContent="";
  if(r.duplicate){
    card.appendChild(el("p",{class:"notice",text:"This request had already been received, so no second booking was created."}));
  }
  card.appendChild(el("span",{class:"badge pending",text:"Pending — not confirmed"}));
  card.appendChild(el("p",{class:"muted sp",text:"Your booking reference"}));
  card.appendChild(el("div",{class:"ref",text:r.reference}));
  if(r.token){
    LS.set("ag_booking_"+r.reference,r.token);
    var mine=JSON.parse(LS.get("ag_mine")||"[]"); if(mine.indexOf(r.reference)<0){mine.push(r.reference);LS.set("ag_mine",JSON.stringify(mine));}
    card.appendChild(el("p",{class:"notice sp",text:"Save your private access code now. It is shown only once and is needed (with your reference) to check this booking. Anyone with it can view your booking."}));
    card.appendChild(el("p",{class:"muted",text:"Private access code"}));
    card.appendChild(el("code",{class:"code",text:r.token}));
    var link=trackLink(r.reference,r.token);
    card.appendChild(el("div",{class:"copyrow"},[copyBtn(r.token,"Copy code"),copyBtn(link,"Copy private link")]));
    card.appendChild(el("div",{class:"sp"},[el("a",{class:"btn",href:"#track?ref="+encodeURIComponent(r.reference)+"&code="+encodeURIComponent(r.token),text:"Check status"})]));
  } else {
    card.appendChild(el("p",{class:"muted sp",text:"The access code was shown when you first submitted. Use it with your reference on the Track Booking page."}));
    card.appendChild(el("div",{class:"sp"},[el("a",{class:"btn",href:"#track",text:"Track Booking"})]));
  }
  card.appendChild(el("p",{class:"muted sp",text:"Management will review your request. It isn't an appointment until you see it marked Approved."}));
  card.scrollIntoView({behavior:"smooth",block:"start"});
}

  if(!configured()){ f.appendChild(el("p",{class:"notice bad",text:"Tracking isn't available yet."})); return f; }
  var out=el("div",{class:"sp",role:"region","aria-live":"polite"});
  var ref=el("input",{id:"t-ref",maxlength:"20",autocomplete:"off",placeholder:"AG-XXXXXX",value:q.ref||"",style:"text-transform:uppercase"});
  var code=el("input",{id:"t-code",maxlength:"80",autocomplete:"off",type:"password",value:q.code||""});
  var go=el("button",{class:"btn",type:"submit",text:"Check status"});
  var form=el("form",{novalidate:true},[
    el("div",{class:"row2"},[el("div",null,[el("label",{for:"t-ref",text:"Booking reference"}),ref]),el("div",null,[el("label",{for:"t-code",text:"Private access code"}),code])]),
    el("div",{class:"sp"},[go])]);
  f.appendChild(el("div",{class:"card"},[form])); f.appendChild(out);

  var mine=[]; try{mine=JSON.parse(LS.get("ag_mine")||"[]")}catch(e){}
  if(mine.length){
    var m=el("div",{class:"sp"},[el("p",{class:"muted",text:"Bookings saved in this browser"})]);
    mine.forEach(function(r){
      m.appendChild(el("div",{class:"mine"},[el("strong",{text:r}),el("span",null,[
        el("button",{class:"btn sm",type:"button",text:"Open",onclick:function(){ref.value=r;code.value=LS.get("ag_booking_"+r)||"";load();}}),
        " ",el("button",{class:"btn sm alt",type:"button",text:"Forget",onclick:function(){
          LS.del("ag_booking_"+r); LS.set("ag_mine",JSON.stringify(mine.filter(function(x){return x!==r}))); route();
        }})])]));
    });
    f.appendChild(m);
  }

  function render(b){
    out.textContent="";
    var c=el("div",{class:"card"});
    c.appendChild(el("div",{class:"ref",text:b.reference}));
    c.appendChild(el("p",null,[el("span",{class:"badge "+b.status,text:STATUS[b.status]||b.status})]));
    c.appendChild(el("p",{class:"notice",text:STATUS_TEXT[b.status]||""}));
    if(b.customer_message) c.appendChild(el("p",{class:"notice good"},[el("strong",{text:"Message from the garage: "}),b.customer_message]));
    var dl=el("dl");
    function add(k,v){ if(v==null||v==="") return; dl.appendChild(el("dt",{text:k})); dl.appendChild(el("dd",{text:v})); }
    add("Name",b.character_name); add("Service",SVC[b.service_type]||b.service_type); add("Vehicle",b.vehicle);
    add("Registration",b.vehicle_reg); add("Requested time",fmt(b.preferred_at));
    if(b.proposed_at) add("Proposed time",fmt(b.proposed_at));
    if(b.scheduled_at) add("Approved appointment",fmt(b.scheduled_at));
    add("Work requested",b.description); add("Last update",fmt(b.updated_at));
    c.appendChild(dl);

    var act=el("div",{class:"sp"}), note=el("div",{role:"alert"});
    function call(a,confirmText){
      if(confirmText&&!confirm(confirmText)) return;
      act.querySelectorAll("button").forEach(function(x){x.disabled=true});
      rpc("customer_action",{p_ref:b.reference,p_token:code.value.trim(),p_action:a,p_note:null}).then(function(r){
        if(r&&r.ok){ toast("Updated"); load(); }
        else { note.className="notice bad"; note.textContent=(r&&r.message)||"That didn't work."; act.querySelectorAll("button").forEach(function(x){x.disabled=false}); }
      }).catch(function(){ note.className="notice bad"; note.textContent="Couldn't reach the booking service."; act.querySelectorAll("button").forEach(function(x){x.disabled=false}); });
    }
    if(b.status==="alternative_proposed"){
      act.appendChild(el("div",{class:"btns"},[
        el("button",{class:"btn",type:"button",text:"Accept "+fmt(b.proposed_at),onclick:function(){call("accept_alternative")}}),
        el("button",{class:"btn alt",type:"button",text:"Decline this time",onclick:function(){call("decline_alternative")}})]));
    }
    if(["pending","alternative_proposed","alternative_accepted","approved"].indexOf(b.status)>=0){
      act.appendChild(el("p",null,[el("button",{class:"btn sm alt",type:"button",text:"Cancel booking",onclick:function(){call("cancel","Cancel this booking?")}})]));
    }
    c.appendChild(act); c.appendChild(note);
    out.appendChild(c);

    if(b.timeline&&b.timeline.length){
      var tl=el("ol",{class:"tl"});
      b.timeline.forEach(function(e){
        tl.appendChild(el("li",null,[el("strong",{text:EVENT[e.action]||e.action}),el("small",{text:fmt(e.at)}),e.message?el("span",{text:e.message}):null]));
      });
      out.appendChild(el("div",{class:"card sp"},[el("h3",{text:"History",style:"font-size:26px;margin-bottom:14px"}),tl]));
    }
  }
  function load(){
    var r=ref.value.trim(), t=code.value.trim();
    if(!r||!t){ out.textContent=""; out.appendChild(el("p",{class:"notice bad",text:"Enter both your reference and access code."})); return; }
    out.textContent=""; out.appendChild(el("div",{class:"skel"}));
    rpc("track_booking",{p_ref:r,p_token:t}).then(function(b){
      if(b&&b.ok){ render(b); LS.set("ag_booking_"+b.reference,t);
        var mm=[];try{mm=JSON.parse(LS.get("ag_mine")||"[]")}catch(e){} if(mm.indexOf(b.reference)<0){mm.push(b.reference);LS.set("ag_mine",JSON.stringify(mm));} }
      else { out.textContent=""; out.appendChild(el("p",{class:"notice bad",text:(b&&b.error==="rate_limited"&&b.message)?b.message:"No booking matches that reference and access code. Check both and try again."})); }
    }).catch(function(){ out.textContent=""; out.appendChild(el("p",{class:"notice bad",text:"Couldn't reach the booking service. Please try again."})); });
  }
  form.addEventListener("submit",function(e){e.preventDefault();load();});
  if(q.ref&&q.code){
    /* remove the secret from the address bar / history once read */
    try{ history.replaceState(null,"",location.pathname+location.search+"#track"); }catch(e){}
    load();
  }
  return f;
}

/* ---------- router ---------- */
var PAGES={home:pageHome,services:pageServices,gallery:pageGallery,book:pageBook,contact:pageContact,track:pageTrack};
var TITLES={home:"Atomic Garage",services:"Our Services",gallery:"Gallery",book:"Book a Service",contact:"Contact",track:"Track Booking"};
function route(){
  var h=location.hash.replace(/^#/,"")||"home";
  var parts=h.split("?"), r=parts[0], q={};
  (parts[1]||"").split("&").forEach(function(kv){ if(!kv) return; var i=kv.indexOf("="); try{ q[decodeURIComponent(kv.slice(0,i<0?kv.length:i))]=i<0?"":decodeURIComponent(kv.slice(i+1)); }catch(e){} });
  if(!PAGES[r]) r="home";
  main.textContent=""; main.appendChild(PAGES[r](q));
  document.title=(r==="home"?"Atomic Garage — Repairs, Tuning, Custom Builds & Towing":TITLES[r]+" — Atomic Garage");
  document.querySelectorAll("nav a[data-r]").forEach(function(a){ if(a.dataset.r===r) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $("#nav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
$("#menuBtn").addEventListener("click",function(){
  var o=$("#nav").classList.toggle("open"); this.setAttribute("aria-expanded",o?"true":"false");
});
if(CFG.STAFF_PORTAL_URL) $("#staffLink").setAttribute("href",CFG.STAFF_PORTAL_URL);
route();
})();
</script>
