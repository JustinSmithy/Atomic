    add("Character",b.character_name);add("Role",ROLE_LABEL[b.role]||b.role);add("Submitted",fmt(b.created_at));add("Last update",fmt(b.updated_at));
    c.appendChild(dl);out.appendChild(c);

    if(dec){
      out.appendChild(el("section",{class:"card sp outcome "+(b.status==="accepted"?"good":"bad"),"aria-label":"Final outcome"},[
        el("h3",{text:b.status==="accepted"?"Application accepted":"Application not successful"}),
        el("p",{text:APP_TXT[b.status]})]));
    }
    if(b.interview){ var ic=interviewCard(b,dec); ic.classList.add("sp"); out.appendChild(ic); }
    else if(b.status==="interview"){
      out.appendChild(el("p",{class:"notice sp",text:"Management wants to speak with you. Your interview time will appear here as soon as it is scheduled."}));
    }

    var items=timelineItems(b);
    if(items.length){
      var tl=el("ol",{class:"tl"});
      items.forEach(function(e){ tl.appendChild(el("li",{class:e.tone},[el("strong",{text:e.label}),el("small",{text:fmt(e.at)})])); });
      out.appendChild(el("div",{class:"card sp"},[el("h3",{text:"Progress",style:"font-size:26px;margin-bottom:14px"}),tl]));
    }
    out.appendChild(el("p",{class:"sp btns"},[
      el("button",{class:"btn sm alt",type:"button",text:"Refresh",onclick:function(){load(true)}}),
      el("a",{class:"btn sm alt",href:"#careers",text:"Back to careers"})]));
  }

  function remember(b,t){
    LS.set("ag_app_"+b.reference,t);
    var mm=[];try{mm=JSON.parse(LS.get("ag_apps")||"[]")}catch(e){} if(mm.indexOf(b.reference)<0){mm.push(b.reference);LS.set("ag_apps",JSON.stringify(mm))}
  }
  function fail(msg){ out.textContent="";out.appendChild(el("p",{class:"notice bad",text:msg})); }
  function load(silent){
    var r=ref.value.trim(),t=code.value.trim();
    if(!r||!t){fail("Enter both your reference and access code.");return}
    if(!silent){ out.textContent="";out.appendChild(el("div",{class:"skel"})); }
    rpc("track_application",{p_ref:r,p_token:t}).then(function(b){
      if(b&&b.ok){ cur={ref:b.reference,tok:t}; lastSig=sigOf(b); formOpen=false; render(b); remember(b,t); startPoll(); }
      else{ stopApPoll(); fail((b&&b.error==="rate_limited"&&b.message)?b.message:"No application matches that reference and access code. Check both and try again."); }
    }).catch(function(){ if(!silent) fail("Couldn't reach the recruitment service. Please try again."); else toast("Couldn't refresh. Check your connection."); });
  }
  /* keep the page current while it is open, without disturbing a request being typed */
  function startPoll(){
    stopApPoll();
    apPoll=setInterval(function(){
      if(!document.body.contains(out)){ stopApPoll(); return; }
      if(document.hidden||formOpen||!cur) return;
      rpc("track_application",{p_ref:cur.ref,p_token:cur.tok}).then(function(b){
        if(b&&b.ok&&!formOpen&&sigOf(b)!==lastSig){ lastSig=sigOf(b); render(b); toast("Your application has been updated"); }
      }).catch(function(){});
    },30000);
  }
  form.addEventListener("submit",function(e){e.preventDefault();load()});
  if(q.ref&&q.code){
    try{history.replaceState(null,"",location.pathname+location.search+"#application")}catch(e){}
    load();
  }
  return f;
}
function pageParts(){
  var f=document.createDocumentFragment(),basket={},money=function(n){return"$"+Number(n).toFixed(2)};
  f.appendChild(head("Parts","Order parts and collect them from the garage. We confirm using the contact details you give."));
  var wrap=el("div"),sum=el("p",{class:"notice",text:"Your basket is empty."}),form=el("div",{class:"card sp"}),done=el("div");
  var inp=function(id,t,max){return el("input",{id:id,type:"text",maxlength:max,autocomplete:"off"})};
  var nm=inp("p-name",0,60),ct=inp("p-contact",0,120),nt=el("textarea",{id:"p-note",maxlength:500,rows:3}),err=el("p",{class:"notice",style:"display:none"});
  var send=el("button",{type:"button",class:"btn",text:"Send order"});
  form.appendChild(field("p-name","Character name",nm));form.appendChild(field("p-contact","Contact (in character)",ct));
  form.appendChild(field("p-note","Note (optional)",nt,true));form.appendChild(err);form.appendChild(send);form.style.display="none";
  var parts=[];
  function upd(){var ids=Object.keys(basket).filter(function(k){return basket[k]>0}),t=0,n=0;
    ids.forEach(function(k){var p=parts.filter(function(x){return x.id===k})[0];if(p){t+=p.price*basket[k];n+=basket[k]}});
    sum.textContent=n?n+" item"+(n>1?"s":"")+" \u2013 total "+money(t):"Your basket is empty.";form.style.display=n?"":"none"}
  send.onclick=function(){err.style.display="none";send.disabled=true;
    var items=Object.keys(basket).filter(function(k){return basket[k]>0}).map(function(k){return{id:k,qty:basket[k]}});
    rpc("submit_part_order",{p:{character_name:nm.value,contact:ct.value,note:nt.value,website:"",items:items}}).then(function(r){
      send.disabled=false;
      if(r&&r.ok){wrap.style.display=form.style.display=sum.style.display="none";
        done.appendChild(el("div",{class:"notice",text:"Order "+r.reference+" received \u2013 total "+money(r.total)+". Save this reference. We will contact you to arrange collection."}))}
      else{err.textContent=(r&&r.message)||"Could not send your order.";err.style.display=""}
    }).catch(function(){send.disabled=false;err.textContent="Could not reach the server. Try again.";err.style.display=""})};
  f.appendChild(wrap);f.appendChild(sum);f.appendChild(form);f.appendChild(done);
  wrap.appendChild(el("div",{class:"skel"}));
  rpc("list_parts",{}).then(function(r){wrap.innerHTML="";
    if(!Array.isArray(r)||!r.length){wrap.appendChild(el("p",{class:"notice",text:"No parts are listed right now. Please check back soon."}));return}
    parts=r;var g=el("div",{class:"grid g2"});
    r.forEach(function(p){var c=el("div",{class:"card"}),q=el("strong",{text:"0",style:"min-width:2ch;text-align:center"});
      if(p.image_url)c.appendChild(el("img",{src:p.image_url,alt:p.name,loading:"lazy",style:"width:100%;height:170px;object-fit:cover;border-radius:8px;margin-bottom:10px"}));
      c.appendChild(el("h3",{text:p.name}));if(p.description)c.appendChild(el("p",{text:p.description}));
      c.appendChild(el("p",{style:"font-weight:700",text:money(p.price)}));
      var row=el("div",{class:"btns"}),m=el("button",{type:"button",class:"btn sm alt",text:"\u2212"}),a=el("button",{type:"button",class:"btn sm",text:"+"});
      m.setAttribute("aria-label","Remove one "+p.name);a.setAttribute("aria-label","Add one "+p.name);
      m.onclick=function(){basket[p.id]=Math.max((basket[p.id]||0)-1,0);q.textContent=basket[p.id];upd()};
      a.onclick=function(){basket[p.id]=Math.min((basket[p.id]||0)+1,50);q.textContent=basket[p.id];upd()};
      row.appendChild(m);row.appendChild(q);row.appendChild(a);c.appendChild(row);g.appendChild(c)});
    wrap.appendChild(g)}).catch(function(){wrap.innerHTML="";wrap.appendChild(el("p",{class:"notice",text:"Parts could not be loaded. Please try again later."}))});
  return f;
}
var PAGES={home:pageHome,services:pageServices,parts:pageParts,careers:pageCareers,application:pageAppTrack,gallery:pageGallery,book:pageBook,contact:pageContact,track:pageTrack};
var TITLES={home:"Atomic Garage",services:"Our Services",parts:"Parts",careers:"Careers",application:"Application Status",gallery:"Gallery",book:"Book a Service",contact:"Contact",track:"Track Booking"};
function route(){
  var h=location.hash.replace(/^#/,"")||"home";
  var parts=h.split("?"), r=parts[0], q={};
  (parts[1]||"").split("&").forEach(function(kv){ if(!kv) return; var i=kv.indexOf("="); try{ q[decodeURIComponent(kv.slice(0,i<0?kv.length:i))]=i<0?"":decodeURIComponent(kv.slice(i+1)); }catch(e){} });
  if(!PAGES[r]) r="home";
  stopApPoll(); main.textContent=""; main.appendChild(PAGES[r](q));
  document.title=(r==="home"?"Atomic Garage — Repairs, Tuning, Custom Builds & Towing":TITLES[r]+" — Atomic Garage");
  document.querySelectorAll("nav a[data-r]").forEach(function(a){ if(a.dataset.r===r||(r==="application"&&a.dataset.r==="careers")) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $("#nav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
$("#menuBtn").addEventListener("click",function(){

});
