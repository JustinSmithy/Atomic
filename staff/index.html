nav{background:var(--pa);-webkit-backdrop-filter:none;backdrop-filter:none}
.card,.clock,.who{background:var(--pa);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero{background:repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,196,0,.06) 22px 44px),var(--pa)}
:root{--pa:rgba(20,20,20,.97)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--pa:rgba(247,245,239,.985)}}
/* Phase 0: readability - solid inner panels, stronger text contrast, tighter spacing on small screens */
.lead,.leg,.row,.stat{background:var(--pa)}
.hero p,.card small,.note{color:var(--ink);opacity:.82}
.card .sec small{opacity:.78}
.row small{opacity:.8}
@media(max-width:560px){.g{gap:12px}.hero h1{font-size:44px}.card .sp{margin-top:12px}}

/* Bookings section */
:root{--bad:#ff7a6b;--warn:#ffb020}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bad:#b3261e;--warn:#8a5a00}}
:root[data-theme="light"]{--bad:#b3261e;--warn:#8a5a00}
[hidden]{display:none!important}
.bk-narrow{max-width:520px}
.bk-tabs,.bk-btns,.bk-chips{display:flex;flex-wrap:wrap;gap:8px}
.bk-tabs{margin-bottom:16px}
.bk-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bk-chips{margin-bottom:16px}.bk-chips b{margin-left:4px;opacity:.8}
.bk-list{display:grid;gap:12px}
.bk-card{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:16px}
.bk-card.open{border-color:var(--acc)}
.bk-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.bk-main{min-width:0}
.bk-ref{font:800 26px "Big Shoulders Display",sans-serif;letter-spacing:.04em;margin-right:8px}
.bk-sub{color:var(--mute);font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.bk-s{font-size:11px;padding:3px 10px}
.bk-pending,.bk-alternative_accepted{color:var(--warn);border-color:var(--warn)}
.bk-alternative_proposed{color:var(--acc);border-color:var(--acc)}
.bk-approved,.bk-in_progress,.bk-completed{color:var(--ok);border-color:var(--ok)}
.bk-declined,.bk-cancelled{color:var(--bad);border-color:var(--bad)}
.bk-detail{margin-top:16px;border-top:1px solid var(--line);padding-top:8px}
.bk-dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:8px 0}
.bk-dl dt{color:var(--mute);font-size:14px}.bk-dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.bk-grp{margin-top:18px}
.bk-h3{font-size:22px;margin-bottom:8px}
.bk-inline{display:flex;gap:8px;flex-wrap:wrap}.bk-inline input,.bk-inline select{flex:1 1 220px;width:auto}
.bk-note{border-left:4px solid var(--acc);background:var(--glow);padding:12px 14px;border-radius:6px;margin:12px 0;font-size:15px}
.bk-note.bad{border-color:var(--bad)}.bk-note.good{border-color:var(--ok)}
button.bk-danger{border-color:var(--bad);color:var(--bad)}
.bk-tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.bk-tl li{position:relative;padding:0 0 14px 20px}
.bk-tl li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--acc)}
.bk-tl li.int::before{background:var(--mute)}
.bk-tl small{display:block;color:var(--mute)}
.bk-code{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
@media(max-width:560px){.bk-dl{grid-template-columns:1fr}.bk-dl dt{margin-top:8px}.bk-row{flex-direction:column}}
.bk-bar{padding:14px 18px;margin-bottom:20px}.bk-bar .bk-tabs{margin:12px 0 0}.bk-bar .bk-top{margin-bottom:0}
/* Staff login gate */
body:not(.ag-in) .app{display:none}
body.ag-in #bkg{display:none}
#bkg{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
#bkg .bk-narrow{width:100%}
.ag-gate-brand{font-weight:800;font-size:1.5rem;letter-spacing:.04em;text-transform:uppercase;text-align:center}
.ag-gate-brand small{display:block;font-size:.8rem;font-weight:600;letter-spacing:.14em;opacity:.7}
.ag-signout{margin-left:auto}
.ag-back{color:inherit;opacity:.8;text-decoration:underline;font-size:.95rem}
nav a.ag-public{margin-top:auto}
.cl-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.cl-bar strong{flex:1;min-width:140px;text-align:center}
.cl-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cl-w{text-align:center;font-size:.8rem;opacity:.7}
.cl-d{all:unset;box-sizing:border-box;cursor:pointer;min-height:78px;padding:6px;border:1px solid rgba(255,255,255,.14);border-radius:10px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cl-d b{font-size:.85rem}.cl-d.out{opacity:.4}.cl-d.today b{color:var(--acc,#ffc400)}.cl-d.sel{border-color:var(--acc,#ffc400);box-shadow:0 0 0 1px var(--acc,#ffc400) inset}
.cl-d:focus-visible{outline:2px solid var(--acc,#ffc400)}.cl-d i{font-size:.72rem;opacity:.7}
.cl-c{font-size:.7rem;line-height:1.2;padding:2px 4px;border-radius:4px;background:rgba(255,255,255,.1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-c.s-pending,.cl-c.s-alternative_proposed{background:var(--acc,#ffc400);color:#111}.cl-c.s-approved,.cl-c.s-alternative_accepted,.cl-c.s-in_progress{background:#2e7d32;color:#fff}
.cl-r{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.1)}
@media(max-width:600px){.cl-d{min-height:56px;padding:4px}.cl-c{display:none}}
.app-c summary{cursor:pointer;list-style:none}.app-c summary small{opacity:.7}
.app-b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;background:rgba(255,255,255,.14);text-transform:capitalize}
.app-b.s-new{background:var(--acc,#ffc400);color:#111}.app-b.s-accepted{background:#2e7d32;color:#fff}.app-b.s-rejected{background:#8b2b2b;color:#fff}.app-b.s-interview{background:#1565c0;color:#fff}
.gd-s summary{cursor:pointer;font-size:1.05rem;text-transform:uppercase;letter-spacing:.03em}
.gd-s h4{margin:16px 0 6px;color:var(--acc,#ffc400)}.gd-s ul{margin:6px 0 10px 20px}.gd-s p{margin:8px 0}
#gd-q{width:100%;margin-top:12px}
.rc-pos-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rc-pos{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:14px 16px}
.rc-pos small{display:block;color:var(--mute);margin-top:4px}
.rc-st{display:inline-block;padding:2px 10px;border-radius:99px;font:700 11px Archivo,sans-serif;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);margin-left:6px}
.rc-st.open{color:var(--ok);border-color:var(--ok)}.rc-st.closed{color:var(--bad);border-color:var(--bad)}
.rc-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.rc-filters select{width:auto;min-width:180px;flex:0 1 220px}.rc-filters input{flex:1 1 220px;width:auto}
.rc-list{display:grid;gap:10px;margin-top:6px}
.rc-app{border:1px solid var(--line);border-radius:12px;background:var(--panel2);overflow:hidden}.rc-app.open{border-color:var(--acc)}
.rc-head{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.rc-head:hover{background:var(--panel)}.rc-head:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.rc-n b{display:block;font-size:17px}.rc-n small{color:var(--mute);overflow-wrap:anywhere}
.rc-b{flex:none;padding:3px 12px;border-radius:99px;font:700 11px Archivo,sans-serif;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--mute);color:var(--ink)}
.rc-b.s-new{border-color:var(--acc);color:var(--acc)}.rc-b.s-reviewing,.rc-b.s-interview{border-color:#6aa9ff;color:#6aa9ff}.rc-b.s-accepted{border-color:var(--ok);color:var(--ok)}.rc-b.s-rejected{border-color:var(--bad);color:var(--bad)}
.rc-detail{padding:4px 16px 18px;border-top:1px solid var(--line)}
.rc-qa{margin:10px 0}.rc-qa b{color:var(--acc);font-size:14px}.rc-qa p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.rc-note{border-left:3px solid var(--acc);background:var(--glow);padding:8px 12px;border-radius:6px;margin:8px 0}.rc-note p{margin:0 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}.rc-note small{color:var(--mute)}
.rc-detail select{width:auto;min-width:180px}.rc-detail textarea{margin-top:8px}.bk-tl li small{display:block;color:var(--mute)}
.rc-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* ---------- mechanical guide ---------- */
function gdParse(t){var secs=[],cur=null,blk=null,H=/^(tools required|disassembly|installation\s*\/\s*replacement|attention)$/i;
  String(t).split(/\r?\n/).forEach(function(raw){var l=raw.replace(/\u00a0/g," ").trim();
    if(!l||l==="."||l==="OP"||/^\[[^\]]+\]\s/.test(l)||/^[\u2014\u2013-]\s*\d{1,2}\/\d{1,2}\/\d{4}/.test(l))return;
    var m=l.match(/^:[a-z0-9_]+:\s*(.+)$/i);
    if(m){cur={title:m[1].trim().replace(/&I NSTALLATION/,"& INSTALLATION"),body:[]};secs.push(cur);blk=null;return}
    if(!cur)return;
    if(H.test(l)){blk={h:l,lines:[]};cur.body.push(blk);return}
    if(!blk){blk={h:"",lines:[]};cur.body.push(blk)}
    blk.lines.push(l)});
  return secs}
function gdLines(b){var o="",ul=false,tools=/tools/i.test(b.h);
  b.lines.forEach(function(l){var it=tools||(l.length<=70&&!/[.!?:]$/.test(l));
    if(it&&!ul){o+="<ul>";ul=true}if(!it&&ul){o+="</ul>";ul=false}
    o+=it?"<li>"+esc(l)+"</li>":"<p>"+esc(l)+"</p>"});
  return o+(ul?"</ul>":"")}
function gdLoad(){return api("guide_sections?select=id,sort,title,body&order=sort.asc").then(function(r){ST.guide=r||[]}).catch(function(e){if(e&&e.message==="auth")throw e;ST.guide=[]})}

    '<input id="gd-q" type="search" placeholder="Search the guide (for example: brakes, torque, airbag)" aria-label="Search the guide"></div>';
  if(!g)h+='<div class="skel sp"></div>';
  else if(!g.length)h+='<div class="card sp"><p class="note">The guide has not been added yet.'+(isMgr()?" Use the import box below.":" Ask a manager to add it.")+'</p></div>';
  else h+=g.map(function(s){return'<details class="card sp gd-s"><summary><strong>'+esc(s.title)+'</strong></summary>'+(s.body||[]).map(function(b){return(b.h?'<h4>'+esc(b.h)+'</h4>':"")+gdLines(b)}).join("")+'</details>'}).join("");

 },function(){

});

  '<div class="jb-tiles" role="tablist">'+T.map(function(t){return'<button type="button" class="jb-tile'+(JB.tab===t[0]?' on':'')+'" role="tab" aria-selected="'+(JB.tab===t[0])+'" data-jb="tab" data-t="'+t[0]+'"><b>'+c[t[0]]+'</b><span>'+t[1]+'</span></button>'}).join("")+'</div>'+
  (JB.err?'<div class="jb-err" role="alert">'+esc(JB.err)+'</div>':'')+
  '<div class="jb-list">'+(rows.length?rows.slice(0,80).map(card).join(""):'<div class="empty">'+empty[JB.tab]+'</div>')+'</div></div>'}

/* ---------- job workspace ---------- */
function runOf(D){return(D.labour||[]).filter(function(l){return l.kind==="session"&&!l.ended_at})[0]}
function mins(D){return(D.labour||[]).reduce(function(a,l){return a+(l.minutes||0)},0)}
function partsSum(D){return(D.parts||[]).reduce(function(a,p){return a+Number(p.unit_price)*p.quantity},0)}
function editable(D,mgr){var j=D.job;return!!j&&(j.status==="in_progress"||j.status==="paused"||(mgr&&j.status==="submitted"))}
function box(title,body,meta){return'<div class="card sp"><h3 class="hd bk-h3" style="margin-top:0">'+title+(meta?' <span class="pill" style="margin-left:8px">'+meta+'</span>':'')+'</h3>'+body+'</div>'}
function dis(){return JB.busy?" disabled":""}
function bar(b,s,D){
 var run=runOf(D),j=D.job;
 if(s==="unassigned")return'<div class="jb-bar"><p>This booking has no mechanic yet.'+(X.isMgr()?' Assign one below to make it startable.':' A manager needs to assign it.')+'</p></div>';
 if(s==="ready")return'<div class="jb-bar"><p>Approved and ready. Starting moves the booking to In progress and starts the work timer.</p><button data-jb="act" data-act="start"'+dis()+'>Start job</button></div>';
 if(s==="working")return'<div class="jb-bar"><span class="jb-clock" id="jb-clock" data-since="'+esc(run?run.started_at:"")+'">00:00:00</span><p>Timer running'+(run?' since '+esc(X.ft(run.started_at)):'')+'.</p><button class="alt" data-jb="act" data-act="pause"'+dis()+'>Pause</button><button data-jb="submit-open"'+dis()+'>Submit for completion</button></div>';
 if(s==="paused"||s==="changes"){var again=b.status==="approved";
  return'<div class="jb-bar"><p>'+(s==="changes"?'<b>Management asked for changes:</b> '+esc(j.review_note)+'<br>':'')+'Timer stopped. '+(again?'Start the job again to continue.':'Resume to keep working, or submit once the work is done.')+'</p><button data-jb="act" data-act="'+(again?'start':'resume')+'"'+dis()+'>'+(again?'Start again':'Resume')+'</button><button class="alt" data-jb="submit-open"'+dis()+'>Submit for completion</button></div>'}
 if(s==="review")return'<div class="jb-bar"><p>Submitted '+esc(X.ft(j.submitted_at))+'. Waiting for management to review and close the job.</p></div>';
 if(s==="closed")return'<div class="jb-bar"><p><b>Closed'+(j&&j.closed_at?' '+esc(X.ft(j.closed_at)):'')+'.</b> The booking is completed. This job is now read-only.</p></div>';
 return'<div class="jb-bar"><p>This booking was cancelled.</p></div>'}
function submitForm(b){return'<div class="card sp jb-form"><h3 class="hd bk-h3" style="margin-top:0">Submit for completion</h3><label for="jb-f-summary">Summary of work performed (required)</label><textarea id="jb-f-summary" maxlength="2000" placeholder="What was done, what was found, anything the customer should know.">'+fv("jb-f-summary")+'</textarea><p class="note">Submitting stops the timer. A manager will review the work, parts and labour before the job is closed.</p><div class="bk-btns sp"><button data-jb="submit"'+dis()+'>Submit job</button><button class="alt" data-jb="submit-cancel">Cancel</button></div></div>'}
function reviewPanel(D){var j=D.job;
 return'<div class="jb-review"><h3 class="hd bk-h3">Review submitted work</h3><p style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(j.work_summary||"")+'</p><p class="note">Labour '+fmtMin(mins(D))+' · Parts '+money(partsSum(D))+'. Check the work log, parts and labour below.</p>'+
  '<label for="jb-f-rv">Message (required to send back, optional when approving)</label><textarea id="jb-f-rv" maxlength="500">'+fv("jb-f-rv")+'</textarea><div class="bk-btns sp"><button data-jb="approve"'+dis()+'>Approve and close job</button><button class="alt" data-jb="changes"'+dis()+'>Send back for changes</button></div></div>'}
function logBox(D,ed){
 var h=ed?'<label for="jb-f-kind">Add to the job</label><div class="jb-row"><select id="jb-f-kind"><option value="work"'+(JB.f["jb-f-kind"]!=="note"?" selected":"")+'>Work performed</option><option value="note"'+(JB.f["jb-f-kind"]==="note"?" selected":"")+'>Job note</option></select></div><textarea id="jb-f-body" maxlength="1000" class="jb-form" placeholder="What did you do or notice?">'+fv("jb-f-body")+'</textarea><div class="sp"><button data-jb="entry"'+dis()+'>Add entry</button></div>':'';
 var e=(D.entries||[]).slice().reverse();
 return box("Work log",h+(e.length?e.map(function(x){return'<div class="jb-ent"><p><span class="jb-tag'+(x.kind==="note"?' note':'')+'">'+(x.kind==="work"?"Work performed":"Note")+'</span>'+esc(x.body)+'</p><small>'+esc(x.author_name)+' · '+esc(X.ft(x.created_at))+'</small></div>'}).join(""):'<p class="note">Nothing logged yet.</p>'),e.length+"")}
function partsBox(D,ed){
 var cat=(JB.parts||[]).map(function(p){return'<option value="'+esc(p.id)+'"'+(JB.f["jb-f-part"]===p.id?" selected":"")+'>'+esc(p.name)+' \u2013 '+money(p.price)+(p.track_stock?(p.stock_qty<=0?' \u2013 OUT OF STOCK':' \u2013 '+p.stock_qty+' in stock'):'')+'</option>'}).join("");
 var add=ed?'<div class="jb-form"><label for="jb-f-part">Add a part from the catalogue</label><div class="jb-row"><select id="jb-f-part"><option value="">Choose a part\u2026</option>'+cat+'</select><input id="jb-f-pq" type="number" min="1" max="999" value="'+esc(JB.f["jb-f-pq"]||"1")+'" aria-label="Quantity" style="max-width:100px"><button data-jb="part"'+dis()+'>Add part</button></div>'+
  '<details class="sp"><summary>Part not in the catalogue</summary><div class="jb-row sp"><input id="jb-f-cn" maxlength="80" placeholder="Part name" value="'+fv("jb-f-cn")+'" aria-label="Part name"><input id="jb-f-cp" type="number" min="0" step="0.01" placeholder="Unit price" value="'+fv("jb-f-cp")+'" aria-label="Unit price" style="max-width:130px"><input id="jb-f-cq" type="number" min="1" max="999" value="'+esc(JB.f["jb-f-cq"]||"1")+'" aria-label="Quantity" style="max-width:90px"><button class="alt" data-jb="part-custom"'+dis()+'>Add</button></div><p class="note">Management reviews typed-in parts before the job is closed.</p></details></div>':'';
 var rows=(D.parts||[]).length?'<div class="tw sp"><table><tr><th>Part</th><th>Qty</th><th>Unit</th><th>Line</th><th>Added by</th>'+(ed?'<th></th>':'')+'</tr>'+D.parts.map(function(p){return'<tr><td>'+esc(p.name)+(p.custom?' <span class="pill">Typed in</span>':'')+(p.stock_deducted_at?' <span class="pill ok" title="Removed from inventory when the job was approved">Stock deducted</span>':(p.track_stock?' <span class="pill" title="Stock is deducted when management approves the job">Stock tracked</span>':''))+'</td><td>'+p.quantity+'</td><td>'+money(p.unit_price)+'</td><td>'+money(p.unit_price*p.quantity)+'</td><td>'+esc(p.added_by_name)+'</td>'+(ed?'<td><button class="alt sm" data-jb="part-del" data-id="'+p.id+'"'+dis()+'>Remove</button></td>':'')+'</tr>'}).join("")+'</table></div><div class="jb-tot"><span>Parts total</span><b>'+money(partsSum(D))+'</b></div>':'<p class="note">No parts recorded.</p>';
 return box("Parts used",add+rows,(D.parts||[]).length+"")}
function labourBox(D,ed){
 var add=ed?'<div class="jb-form"><label for="jb-f-lm">Add time not captured by the timer</label><div class="jb-row"><input id="jb-f-lm" type="number" min="1" max="1440" placeholder="Minutes" value="'+fv("jb-f-lm")+'" aria-label="Minutes" style="max-width:120px"><input id="jb-f-ld" maxlength="300" placeholder="What was the time spent on?" value="'+fv("jb-f-ld")+'" aria-label="Description"><button class="alt" data-jb="lab-add"'+dis()+'>Add time</button></div></div>':'';
 var rows=(D.labour||[]).length?'<div class="tw sp"><table><tr><th>Who</th><th>Type</th><th>When</th><th>Time</th>'+(ed?'<th></th>':'')+'</tr>'+D.labour.map(function(l){var open=l.kind==="session"&&!l.ended_at;
  return'<tr><td>'+esc(l.user_name)+'</td><td>'+(l.kind==="session"?"Timer":"Added by hand")+(l.description?'<br><small>'+esc(l.description)+'</small>':'')+'</td><td>'+esc(X.ft(l.started_at))+'</td><td>'+(open?'running':fmtMin(l.minutes||0))+'</td>'+(ed?'<td>'+(l.kind==="manual"?'<button class="alt sm" data-jb="lab-del" data-id="'+l.id+'"'+dis()+'>Remove</button>':'')+'</td>':'')+'</tr>'}).join("")+'</table></div><div class="jb-tot"><span>Recorded labour</span><b>'+fmtMin(mins(D))+'</b></div>':'<p class="note">No time recorded yet. The timer starts when the job starts.</p>';
 return box("Labour",add+rows,fmtMin(mins(D)))}
function histBox(D){var ev=(D.events||[]).slice().reverse();
 return box("History",'<ol class="jb-tl">'+ev.map(function(e){return'<li><b>'+esc(EL[e.action]||e.action)+'</b><small>'+esc(e.actor_name)+' ('+esc(e.actor_role)+') \u00b7 '+esc(X.ft(e.at))+'</small>'+(e.detail?'<div class="d">'+esc(e.detail)+'</div>':'')+'</li>'}).join("")+'</ol>',ev.length+"")}
function directClose(b){
 return'<details class="card sp"><summary><b>Close without a work log</b></summary><p class="note">For work done in person that was never logged here. A reason is required and is recorded in the history.</p><label for="jb-f-cd">Reason</label><textarea id="jb-f-cd" maxlength="500">'+fv("jb-f-cd")+'</textarea><div class="sp"><button class="alt'+(JB.armed==="cd"?" jb-danger":"")+'" data-jb="'+(JB.armed==="cd"?"close-direct":"arm-cd")+'"'+dis()+'>'+(JB.armed==="cd"?"Click again to close this job":"Close job")+'</button></div></details>'}
function detailView(){
 var id=JB.open,b=(ST.list||[]).filter(function(x){return x.id===id})[0],D=JB.detail[id];
 var back='<a class="jb-back" href="#jobs">\u2190 All jobs</a>';
 if(!b||!D)return back+'<div class="card"><div class="empty">'+(JB.loading?'Loading the job\u2026':'This job could not be found, or it is not assigned to you.')+'</div></div>';
 var s=stateOf(b),mgr=X.isMgr(),ed=editable(D,mgr);
 var dl=[["Customer",b.character_name],["Contact (in-character)",b.contact],["Vehicle",b.vehicle],["Registration",b.vehicle_reg],["Service",X.SVC[b.service_type]||b.service_type],["Booking reference",b.reference],
  ["Appointment",b.scheduled_at?X.ft(b.scheduled_at):X.ft(b.preferred_at)],["Mechanic",b.assigned_to?X.nameOf(b.assigned_to):"Not assigned"]].filter(function(x){return x[1]}).map(function(x){return'<div><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>'}).join("")+'<div class="wide"><dt>Work requested</dt><dd style="white-space:pre-wrap">'+esc(b.description)+'</dd></div>';
 return back+'<div class="card"><div class="jb-head"><h2>'+esc(b.reference)+'</h2><span class="jb-st '+s+'">'+LBL[s]+'</span></div><dl class="jb-dl">'+dl+'</dl>'+
  (JB.err?'<div class="jb-err" role="alert">'+esc(JB.err)+'</div>':'')+bar(b,s,D)+'</div>'+
  (mgr&&s!=="closed"&&s!=="cancelled"?'<div class="card sp"><h3 class="hd bk-h3" style="margin-top:0">Assigned mechanic</h3>'+assignBox(b)+'</div>':'')+
  (JB.submitOpen&&(s==="working"||s==="paused"||s==="changes")?submitForm(b):'')+
  (mgr&&s==="review"?reviewPanel(D):'')+
  (D.job&&D.job.work_summary&&(s==="review"&&!mgr||s==="closed")?box("Work summary",'<p style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(D.job.work_summary)+'</p>'+(D.job.review_note?'<p class="note">Management note: '+esc(D.job.review_note)+'</p>':'')):'')+
  (D.job?logBox(D,ed)+partsBox(D,ed)+labourBox(D,ed)+(window.AGINVC&&window.AGINVC.jobHtml?window.AGINVC.jobHtml(b,D):'')+histBox(D):'<div class="card sp"><p class="note">Nothing has been recorded yet. The work log, parts and labour open when the job starts.</p></div>')+
  (mgr&&(s==="ready"||s==="working"||s==="paused"||s==="changes")?directClose(b):'')}

/* ---------- render / lifecycle ---------- */
function render(){var el=q("#jb");if(!el)return;
 var keep=document.activeElement&&document.activeElement.id,sel=null;
 try{if(keep&&/^jb-f-/.test(keep)&&document.activeElement.setSelectionRange)sel=[document.activeElement.selectionStart,document.activeElement.selectionEnd]}catch(e){}
 if(!X.hasSession()){el.innerHTML='<div class="card">'+sec("\u2699","Jobs","Sign in to see your work")+'<p class="note">Sign in on the Bookings page with your staff account, then come back here.</p><a class="btn" href="#bookings">Go to sign in</a></div>';return}
 if(ST.me===undefined){el.innerHTML='<div class="card"><div class="sk" style="height:140px"></div></div>';return}
 if(!ST.me||!ST.me.active){el.innerHTML='<div class="card">'+sec("\u2699","Jobs","Staff access needed")+'<p class="note">Your account does not have staff access.</p></div>';return}
 if(ST.me.role!=="manager"&&ST.me.role!=="mechanic"){el.innerHTML='<div class="card">'+sec("\u2699","Jobs","Not part of your role")+'<p class="note">Jobs are handled by mechanics and managers.</p></div>';return}
 if(!JB.loaded){el.innerHTML='<div class="card"><div class="sk" style="height:200px"></div></div>';return}
 el.innerHTML=JB.open?detailView():listView();
 if(keep&&/^jb-f-/.test(keep)){var f=document.getElementById(keep);if(f){f.focus();try{if(sel)f.setSelectionRange(sel[0],sel[1])}catch(e){}}}
 tick()}
function tick(){var c=q("#jb-clock");if(!c||!c.dataset.since)return;var s=Math.max(0,Math.floor((Date.now()+JB.skew-Date.parse(c.dataset.since))/1000));
 var p=function(n){return(n<10?"0":"")+n};c.textContent=p(Math.floor(s/3600))+":"+p(Math.floor(s%3600/60))+":"+p(s%60)}
function navLink(){var l=document.querySelector('nav a[data-v="jobs"]');if(l)l.hidden=!(X.hasSession()&&ST.me&&ST.me.active&&(ST.me.role==="manager"||ST.me.role==="mechanic"))}
function kick(){
 navLink();var p=hash();JB.open=p[1]||null;JB.err="";if(!JB.open)JB.submitOpen=false;
 render();
 if(!X.hasSession())return;
 if(ST.me===undefined)X.boot();
 var n=0,w=setInterval(function(){n++;if(!q("#jb")){clearInterval(w);return}
  if(ST.me!==undefined||n>60){clearInterval(w);navLink();
   if(ST.me&&ST.me.active&&(ST.me.role==="manager"||ST.me.role==="mechanic")){JB.loading=true;load().then(function(){return JB.open?loadDetail(JB.open):null}).catch(fail).then(function(){JB.loading=false;render()})}else render()}},250)}
window.V.jobs=function(){setTimeout(kick,0);return'<div id="jb"></div>'};

/* ---------- events ---------- */
document.addEventListener("click",function(e){
 var b=e.target.closest&&e.target.closest("[data-jb]");if(!b||b.disabled)return;
 var a=b.dataset.jb,id=JB.open;
 if(a==="tab"){JB.tab=b.dataset.t;render()}
 else if(a==="assign"){var tid=b.dataset.id,v=(document.getElementById("jb-as-"+tid)||{}).value||null;
  if(JB.busy)return;JB.busy=true;JB.err="";render();
  X.rpc("staff_booking_action",{p_id:tid,p_action:"assign",p:{mechanic_id:v}}).then(function(r){if(r&&r.ok===false)throw new Error(r.message||"Could not assign.");X.say(v?"Mechanic assigned":"Mechanic removed");return reload()}).catch(fail).then(function(){JB.busy=false;render()})}
 else if(a==="act")act(id,b.dataset.act,{},b.dataset.act==="start"?"Job started":b.dataset.act==="pause"?"Job paused":"Job resumed");
 else if(a==="submit-open"){JB.submitOpen=true;render();var t=q("#jb-f-summary");if(t)t.focus()}
 else if(a==="submit-cancel"){JB.submitOpen=false;render()}
 else if(a==="submit"){var sm=(JB.f["jb-f-summary"]||"").trim();if(sm.length<5){JB.err="Describe the work you performed before submitting.";render();return}
  act(id,"submit",{summary:sm},"Submitted for review",function(){JB.submitOpen=false;JB.f["jb-f-summary"]=""})}
 else if(a==="entry"){var body=(JB.f["jb-f-body"]||"").trim();if(!body){JB.err="Write something first.";render();return}
  act(id,"add_entry",{kind:JB.f["jb-f-kind"]==="note"?"note":"work",body:body},"Added to the work log",function(){JB.f["jb-f-body"]=""})}
 else if(a==="part"){var pid=JB.f["jb-f-part"];if(!pid){JB.err="Choose a part first.";render();return}
  act(id,"add_part",{part_id:pid,quantity:JB.f["jb-f-pq"]||"1"},"Part added",function(){JB.f["jb-f-part"]="";JB.f["jb-f-pq"]="1"})}
 else if(a==="part-custom")act(id,"add_part",{name:JB.f["jb-f-cn"]||"",price:JB.f["jb-f-cp"]||"",quantity:JB.f["jb-f-cq"]||"1"},"Part added",function(){JB.f["jb-f-cn"]="";JB.f["jb-f-cp"]="";JB.f["jb-f-cq"]="1"});
 else if(a==="part-del")act(id,"remove_part",{id:b.dataset.id},"Part removed");
 else if(a==="lab-add")act(id,"add_labour",{minutes:JB.f["jb-f-lm"]||"",description:JB.f["jb-f-ld"]||""},"Time added",function(){JB.f["jb-f-lm"]="";JB.f["jb-f-ld"]=""});
 else if(a==="lab-del")act(id,"remove_labour",{id:b.dataset.id},"Time removed");
 else if(a==="approve")act(id,"approve",{message:JB.f["jb-f-rv"]||""},"Job approved and closed",function(){JB.f["jb-f-rv"]=""});
 else if(a==="changes"){if(!(JB.f["jb-f-rv"]||"").trim()){JB.err="Tell the mechanic what needs to change.";render();return}
  act(id,"request_changes",{message:JB.f["jb-f-rv"]},"Sent back to the mechanic",function(){JB.f["jb-f-rv"]=""})}
 else if(a==="arm-cd"){if(!(JB.f["jb-f-cd"]||"").trim()){JB.err="Give a reason first.";render();return}JB.armed="cd";render()}
 else if(a==="close-direct"){JB.armed=null;act(id,"close_direct",{message:JB.f["jb-f-cd"]||""},"Job closed",function(){JB.f["jb-f-cd"]=""})}
});
function store(e){var t=e.target;if(t&&/^jb-f-/.test(t.id||"")){JB.f[t.id]=t.value;if(t.id==="jb-f-cd"&&JB.armed){JB.armed=null}}}
document.addEventListener("input",store);document.addEventListener("change",store);
setInterval(tick,1000);
setInterval(function(){navLink();if(!/^#jobs/.test(location.hash)||!X.hasSession()||!ST.me||JB.busy||document.hidden||!q("#jb"))return;
 var a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
 reload().then(render).catch(function(e){fail(e);render()})},30000);
if(/^#jobs/.test(location.hash)&&typeof route==="function")route();
})();
</script>
<script>
/* ===== Atomic Garage: Operations hub, Manager Access, server-side attendance, My Profile =====
   Every permission decision is made by the database (RLS + checked functions). This file only presents it. */
(function(){
"use strict";
var X=window.AGX;if(!X)return;
var ST=X.ST,ft=X.ft;
function q(s){return document.querySelector(s)}
function active(){return X.hasSession()&&ST.me&&ST.me.active}
function role(){return ST.me&&ST.me.role}
function isM(){return role()==="manager"}
function isRec(){return role()==="manager"||role()==="hr"}
function money(n){return"$"+Number(n).toFixed(2)}
function hrs(n){return n==null?"\u2014":(+Number(n).toFixed(2))+" h"}
function mins(m){m=Math.round(m||0);var h=Math.floor(m/60);return h?h+"h "+(m%60<10?"0":"")+(m%60)+"m":(m%60)+"m"}
function span(a,b){return b?mins((Date.parse(b)-Date.parse(a))/60000):"running"}
function day(d){return d?new Date(d).toLocaleDateString(undefined,{dateStyle:"medium"}):"\u2014"}
function parts(){return(location.hash||"").slice(1).split("/")}
function localIso(v){if(!v)return null;var d=new Date(v);return isNaN(d)?null:d.toISOString()}
function toLocalInput(iso){if(!iso)return"";var d=new Date(iso);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function initials(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(function(x){return x.charAt(0).toUpperCase()}).join("")}
var EL={started:"Started a job",resumed:"Resumed a job",paused:"Paused a job",work_logged:"Logged work",note_added:"Added a note",part_added:"Added a part",part_removed:"Removed a part",labour_added:"Added labour",labour_removed:"Removed labour",submitted:"Submitted a job",changes_requested:"Requested changes",approved:"Approved a job",closed_direct:"Closed a job",reassigned:"Changed an assignment",cancelled:"Job cancelled"};
var AL={clock_in:"Clocked in",clock_out:"Clocked out",auto_capped:"Clock-out capped at 16 hours",imported:"Imported device history",import_approved:"Imported shifts approved",import_rejected:"Imported shifts rejected",corrected:"Shift corrected",shift_added:"Shift added by a manager",shift_deleted:"Shift deleted by a manager",profile_updated:"Profile fields updated by a manager"};
var OP={f:{},busy:false,err:"",pf:null,mg:null};
function wait(done){if(!X.hasSession()){done();return}var n=0,w=setInterval(function(){n++;if(ST.me!==undefined||n>80){clearInterval(w);done()}},250);if(ST.me===undefined&&X.hasSession())X.boot();}

/* ================= navigation: Operations menu, aliases ================= */
var ALIAS={"operations/bookings":"#bookings","operations/jobs":"#jobs","operations/applications":"#recruitment","operations/manager":"#manager","bookings/team":"#manager/staff","bookings/parts":"#manager/parts","bookings/apps":"#recruitment","manager/applications":"#recruitment","manager/profiles":"#manager/attendance"};
window.AGR=function(h){var k=(h||"").replace(/^#/,"");return ALIAS[k]||null};
var OPSET=["operations","bookings","jobs","invoices","recruitment","manager"];
window.AGNAV=function(v){var a=q("#ag-ops");if(a)a.classList.toggle("on",OPSET.indexOf(v)>-1);var p=q('nav a[data-v="profile"]');if(p)p.hidden=!active()};
function menuItems(){var it=[["#operations","Operations overview","Everything in one place"],["#bookings","Bookings","Requests, scheduling, assignments"]];
 if(role()==="manager"||role()==="mechanic")it.push(["#jobs","Jobs",isM()?"Dispatch and review work":"Your assigned work"]);
 if(isM())it.push(["#invoices","Invoices","Bill jobs, track payments"]);

var lastSync=0,clockBusy=false;
function adoptServer(open){var S=window.S;if(!S)return false;var t=open?Date.parse(open.started_at):null;
 if(t&&S.start!==t){S.start=t;ensureSelf();save();return true}
 if(!t&&S.start){S.start=null;ensureSelf();save();return"cleared"}return false}
function syncShift(force){if(!active())return Promise.resolve();var n=Date.now();if(!force&&n-lastSync<8000)return Promise.resolve();lastSync=n;
 return X.rpc("shift_status").then(function(r){if(!r||r.ok===false)return;var ch=adoptServer(r.open);
  if(ch==="cleared")toast("This device showed a session that was never recorded on the server. Clock in again to record your shift.");
  if(ch&&/^#(dashboard|home|profile)/.test(location.hash||"#home"))route()}).catch(function(){})}
function endLocal(endMs){var S=window.S,h=Math.max(0,(endMs-S.start)/36e5);S.hours+=h;S.life+=h;S.shifts++;S.log.push({n:S.name,s:S.start,e:endMs});if(S.log.length>200)S.log.shift();S.start=null}

 X.rpc("shift_status").then(function(st){if(st&&st.ok===false)throw new Error(st.message);var on=!!st.open;
  return X.rpc(on?"shift_clock_out":"shift_clock_in").then(function(r){return{on:on,r:r}})}).then(function(o){var r=o.r;
  if(r.ok===false&&r.error==="already_clocked_in"){S.start=Date.parse(r.started_at);toast("You were already clocked in. Your clock now matches the server.")}
  else if(r.ok===false){toast(r.message||"Could not record that.")}
  else if(o.on){if(S.start&&Date.parse(r.started_at)!==S.start)S.start=Date.parse(r.started_at);endLocal(Date.parse(r.ended_at));toast(r.capped?"Clocked out. The shift ran over 16 hours, so 16 hours were recorded and a manager will review it.":"Clocked out and recorded ("+mins(r.minutes)+")")}
  else{S.start=Date.parse(r.started_at);toast("Clocked in at "+utc(S.start)+" UTC (server time)")}
  ensureSelf();save();route();if(q("#pf"))pfLoad()}).catch(function(e){X.authErr(e);toast("Could not reach the server, so nothing was recorded. Please try again.")}).then(function(){clockBusy=false})};

  if(t.closest("#ag-links a")&&!t.closest("#ag-ops")){closeNav();return}
  if(!t.closest(".ag-pop")&&!t.closest("#ag-links"))close();
});

});

draw(true);setInterval(draw,1500);
})();

<script>/*AGINV-START*/
/* ===== Atomic Garage: Inventory (Parts store + manager stock control) =====

   This file only presents what the server allows. */
(function(){

function money(n){return"$"+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2})}
function st(p){if(!p.track_stock)return"untracked";if(p.stock_qty<=0)return"out";if(p.stock_qty<=p.low_stock_level)return"low";return"in"}

/* ---------- staff Parts store (live catalogue, all staff) ---------- */
function storeList(){

    return'<tr><td><b>'+esc(p.name)+'</b>'+(p.description?'<br><small>'+esc(p.description)+'</small>':"")+'</td><td>'+esc(p.category||"—")+'</td><td>'+money(p.price)+'</td><td>'+badge(p,true)+'</td><td>'+

function cartText(){var t=0,l=[];(ST.parts||[]).forEach(function(p){var q=INV.cart[p.id];if(q>0){t+=q*p.price;l.push(q+"x "+p.name)}});return{t:t,txt:l.length?"Order: "+l.join(", ")+". Total "+money(t):""}}

function storeDraw(){var el=document.getElementById("inv-store");if(!el)return;var c=cats(ST.parts.filter(function(p){return p.active}));
  el.innerHTML='<div class="card">'+X.sec("▦","Parts store","Live catalogue and stock levels")+'<div class="tools"><input id="iv-sq" placeholder="Search parts" aria-label="Search parts" value="'+esc(INV.sq)+'"><select id="iv-scat" aria-label="Category"><option value="all">All categories</option>'+c.map(function(x){return'<option'+(x===INV.scat?" selected":"")+'>'+esc(x)+'</option>'}).join("")+'</select></div><div id="iv-slist" class="sp">'+storeList()+'</div></div>'+
   '<div class="card sp"><h3 class="hd" style="font-size:26px">Order</h3><div class="num" id="iv-ct" style="margin:10px 0"></div><textarea id="iv-co" readonly aria-label="Order text"></textarea><div class="sp"><button class="alt" data-inv="cart-clear">Clear order</button></div></div>';
  cartDraw()}
function cartDraw(){var c=cartText(),a=document.getElementById("iv-ct"),b=document.getElementById("iv-co");if(a)a.textContent=money(c.t);if(b)b.value=c.txt}

/* ---------- manager inventory ---------- */
function filtered(){var q=INV.q.toLowerCase();return(ST.parts||[]).filter(function(p){
  if(INV.cat!=="all"&&p.category!==INV.cat)return false;
  if(q&&(p.name+" "+(p.category||"")+" "+(p.sku||"")).toLowerCase().indexOf(q)<0)return false;
  var s=st(p);if(INV.flt==="low")return s==="low"||s==="out";if(INV.flt==="out")return s==="out";if(INV.flt==="untracked")return s==="untracked";if(INV.flt==="hidden")return!p.active;return true})}

  return'<div class="tw"><table><tr><th>Part</th><th>Category</th><th>Price</th><th>Stock</th><th>Alert at</th><th>Website</th><th></th></tr>'+L.map(function(p){
    return'<tr><td><b>'+esc(p.name)+'</b>'+(p.sku?'<br><small>SKU '+esc(p.sku)+'</small>':"")+'</td><td>'+esc(p.category||"—")+'</td><td>'+money(p.price)+'</td><td>'+(p.track_stock?'<b>'+p.stock_qty+'</b> ':"")+badge(p)+'</td><td>'+(p.track_stock?p.low_stock_level:"—")+'</td><td>'+(p.active?"Visible":'<span class="pill">Hidden</span>')+'</td><td>'+
    '<button class="alt sm" data-inv="edit" data-id="'+esc(p.id)+'">Edit</button> '+(p.track_stock?'<button class="alt sm" data-inv="adj" data-id="'+esc(p.id)+'">Adjust stock</button> ':"")+'<button class="alt sm" data-inv="hist" data-id="'+esc(p.id)+'">History</button></td></tr>'}).join("")+'</table></div>'}
function summary(){var P=ST.parts||[],t=P.filter(function(p){return p.track_stock}),low=t.filter(function(p){return st(p)==="low"}),out=t.filter(function(p){return st(p)==="out"});
  function chip(n,l,f,cls){return'<button type="button" class="alt iv-chip '+(cls||"")+(INV.flt===f?" on":"")+'" data-inv="flt" data-f="'+f+'"><b>'+n+'</b> '+l+'</button>'}
  return'<div class="iv-chips">'+chip(P.length,"parts","all")+chip(t.length,"tracked","all")+chip(low.length,"low stock","low","iv-low")+chip(out.length,"out of stock","out","iv-out")+chip(P.length-t.length,"not tracked","untracked")+'</div>'}
function editPanel(){var e=INV.edit;if(!e)return"";var p=e.id?(ST.parts||[]).filter(function(x){return x.id===e.id})[0]||{}:{},isNew=!e.id;
  var C=cats(ST.parts);
  function f(k,d){return fv("e_"+k,d)}
  return'<div class="card sp iv-panel"><h3 class="hd bk-h3" style="margin-top:0">'+(isNew?"Add a part":"Edit "+esc(p.name))+'</h3>'+(INV.err?'<div class="jb-err" role="alert">'+esc(INV.err)+'</div>':"")+
  '<div class="jb-row"><div><label for="iv-e-name">Name</label><input id="iv-e-name" data-ivf="e_name" maxlength="80" value="'+esc(f("name",p.name||""))+'"></div><div><label for="iv-e-cat">Category</label><input id="iv-e-cat" data-ivf="e_category" maxlength="40" list="iv-cats" value="'+esc(f("category",p.category||""))+'"><datalist id="iv-cats">'+C.map(function(c){return'<option value="'+esc(c)+'">'}).join("")+'</datalist></div></div>'+
  '<div class="jb-row"><div><label for="iv-e-sku">SKU (optional, unique)</label><input id="iv-e-sku" data-ivf="e_sku" maxlength="40" value="'+esc(f("sku",p.sku||""))+'"></div><div><label for="iv-e-price">Price ($)</label><input id="iv-e-price" data-ivf="e_price" type="number" min="0" step="0.01" value="'+esc(f("price",p.price==null?"":p.price))+'"></div></div>'+
  '<label><input type="checkbox" id="iv-e-track" data-ivf="e_track" '+(f("track",p.track_stock?"1":"")?"checked":"")+'> Track stock for this part</label>'+
  (f("track",p.track_stock?"1":"")?'<div class="jb-row"><div><label for="iv-e-low">Low-stock alert at</label><input id="iv-e-low" data-ivf="e_low" type="number" min="0" value="'+esc(f("low",p.low_stock_level==null?0:p.low_stock_level))+'"></div>'+(isNew?'<div><label for="iv-e-open">Opening stock</label><input id="iv-e-open" data-ivf="e_open" type="number" min="0" value="'+esc(f("open","0"))+'"></div>':'<div><label>Current stock</label><div class="note" style="margin:10px 0">'+p.stock_qty+' – change it with Adjust stock so the reason is recorded.</div></div>')+'</div>':"")+
  '<label for="iv-e-img">Image link (https://...)</label><input id="iv-e-img" data-ivf="e_img" maxlength="500" value="'+esc(f("img",p.image_url||""))+'">'+
  '<label for="iv-e-desc">Description</label><textarea id="iv-e-desc" data-ivf="e_desc" maxlength="400" rows="2">'+esc(f("desc",p.description||""))+'</textarea>'+
  '<div class="jb-row"><div><label for="iv-e-sort">Sort order (lower shows first)</label><input id="iv-e-sort" data-ivf="e_sort" type="number" value="'+esc(f("sort",p.sort||0))+'"></div></div>'+
  '<label><input type="checkbox" id="iv-e-act" data-ivf="e_act" '+(f("act",p.active===false?"":"1")?"checked":"")+'> Visible on the public Parts page</label>'+
  '<div class="sp bk-btns"><button data-inv="save"'+(INV.busy?" disabled":"")+'>'+(isNew?"Add part":"Save changes")+'</button><button class="alt" data-inv="cancel">Cancel</button>'+(!isNew?' <button class="alt" data-inv="del" data-id="'+esc(p.id)+'">Delete</button>':"")+'</div></div>'}
function adjPanel(){var a=INV.adj;if(!a)return"";var p=(ST.parts||[]).filter(function(x){return x.id===a.id})[0];if(!p)return"";
  return'<div class="card sp iv-panel"><h3 class="hd bk-h3" style="margin-top:0">Adjust stock – '+esc(p.name)+'</h3><p class="note">On hand now: <b>'+p.stock_qty+'</b>. Stock cannot go below zero, and every change is recorded with your name and reason.</p>'+(INV.err?'<div class="jb-err" role="alert">'+esc(INV.err)+'</div>':"")+
  '<div class="jb-row"><div><label for="iv-a-mode">Action</label><select id="iv-a-mode" data-ivf="a_mode"><option value="receive"'+(fv("a_mode","receive")==="receive"?" selected":"")+'>Receive stock (add)</option><option value="remove"'+(fv("a_mode")==="remove"?" selected":"")+'>Remove stock (damaged, lost, used elsewhere)</option><option value="set"'+(fv("a_mode")==="set"?" selected":"")+'>Set counted total (stocktake)</option></select></div>'+
  '<div><label for="iv-a-q">'+(fv("a_mode","receive")==="set"?"New total":"Quantity")+'</label><input id="iv-a-q" data-ivf="a_q" type="number" min="0" value="'+esc(fv("a_q",""))+'"></div></div>'+
  '<label for="iv-a-r">Reason (required)</label><input id="iv-a-r" data-ivf="a_r" maxlength="200" placeholder="e.g. Supplier delivery, stocktake correction" value="'+esc(fv("a_r",""))+'">'+
  '<div class="sp bk-btns"><button data-inv="adj-save"'+(INV.busy?" disabled":"")+'>Record adjustment</button><button class="alt" data-inv="cancel">Cancel</button></div></div>'}
var KIND={opening:"Opening stock",receive:"Received",adjust:"Removed",stocktake:"Stocktake",job_use:"Used on job",order_use:"Parts order",order_restore:"Order restored"};
function histPanel(){var h=INV.hist;if(!h)return"";var D=INV.hdata;
  var title=h.id==="all"?"All stock movements":"History – "+esc(((ST.parts||[]).filter(function(x){return x.id===h.id})[0]||{}).name||"part");
  var body=!D?'<div class="sk" style="height:120px"></div>':
   (D.ledger.length?'<div class="tw"><table><tr><th>When</th>'+(h.id==="all"?'<th>Part</th>':"")+'<th>Type</th><th>Change</th><th>Stock</th><th>Reason</th><th>By</th></tr>'+D.ledger.map(function(l){return'<tr><td>'+esc(X.ft(l.created_at))+'</td>'+(h.id==="all"?'<td>'+esc(l.part_name)+'</td>':"")+'<td>'+esc(KIND[l.kind]||l.kind)+'</td><td><b style="color:'+(l.delta<0?'var(--bad,#ff6b6b)':'var(--ok)')+'">'+(l.delta>0?"+":"")+l.delta+'</b></td><td>'+l.qty_before+' → '+l.qty_after+'</td><td style="white-space:normal">'+esc(l.reason||"")+'</td><td>'+esc(l.actor_name)+'</td></tr>'}).join("")+'</table></div>':'<p class="note">No stock movements yet.</p>')+
   (D.audit.length?'<h4 style="margin:18px 0 6px">Catalogue changes</h4><div class="tw"><table><tr><th>When</th><th>Part</th><th>Change</th><th>By</th></tr>'+D.audit.map(function(a){var d=a.detail||{},t=a.action==="price_changed"?"Price "+money(d.from)+" → "+money(d.to):a.action.replace(/_/g," ");if(a.action==="updated")t="Updated "+Object.keys(d).join(", ");return'<tr><td>'+esc(X.ft(a.at))+'</td><td>'+esc(a.part_name)+'</td><td style="white-space:normal">'+esc(t)+'</td><td>'+esc(a.actor_name)+'</td></tr>'}).join("")+'</table></div>':"");
  return'<div class="card sp iv-panel"><div class="bk-btns" style="justify-content:space-between"><h3 class="hd bk-h3" style="margin:0">'+title+'</h3><button class="alt sm" data-inv="cancel">Close</button></div>'+body+'</div>'}
function orders(){var o=ST.porders||[];
  return'<div class="card sp"><h3 class="hd bk-h3">Part orders</h3><p class="note">Stock for tracked parts is taken off when an order is set to Ready (or Collected) and put back if it is moved back to New or Cancelled.</p>'+
  (o.length?'<div class="tw"><table><tr><th>Ref</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>'+o.map(function(x){
   return'<tr><td>'+esc(x.reference)+'</td><td>'+esc(x.character_name)+'<br><small>'+esc(x.contact)+'</small>'+(x.note?'<br><small>'+esc(x.note)+'</small>':"")+'</td><td>'+(x.items||[]).map(function(i){return esc(i.qty)+" × "+esc(i.name)}).join("<br>")+'</td><td>'+money(x.total)+'</td><td><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:230px"><select id="iv-os-'+esc(x.id)+'" aria-label="Status for '+esc(x.reference)+'" style="width:auto">'+["new","ready","collected","cancelled"].map(function(s){return'<option'+(s===x.status?" selected":"")+'>'+s+'</option>'}).join("")+'</select> <button class="alt sm" data-inv="order-set" data-id="'+esc(x.id)+'">Update</button>'+(x.stock_deducted?' <span class="pill ok">Stock taken</span>':"")+'</div></td></tr>'}).join("")+'</table></div>':'<p class="note">No part orders yet.</p>')+'</div>'}
function managerHtml(){
  var C=cats(ST.parts);
  return'<div class="card sp"><h3 class="hd bk-h3" style="margin-top:0">Inventory</h3>'+(INV.ok?'<div class="note" role="status" style="color:var(--ok)">'+esc(INV.ok)+'</div>':"")+(INV.err&&!INV.edit&&!INV.adj?'<div class="jb-err" role="alert">'+esc(INV.err)+'</div>':"")+summary()+
  '<div class="tools sp"><input id="iv-q" placeholder="Search name, SKU or category" aria-label="Search parts" value="'+esc(INV.q)+'"><select id="iv-cat" aria-label="Category"><option value="all">All categories</option>'+C.map(function(c){return'<option'+(c===INV.cat?" selected":"")+'>'+esc(c)+'</option>'}).join("")+'</select><select id="iv-flt" aria-label="Filter"><option value="all">All parts</option><option value="low"'+(INV.flt==="low"?" selected":"")+'>Low or out of stock</option><option value="out"'+(INV.flt==="out"?" selected":"")+'>Out of stock</option><option value="untracked"'+(INV.flt==="untracked"?" selected":"")+'>Not tracked</option><option value="hidden"'+(INV.flt==="hidden"?" selected":"")+'>Hidden on website</option></select></div>'+
  '<div class="bk-btns sp"><button data-inv="new">Add a part</button><button class="alt" data-inv="hist" data-id="all">All stock movements</button></div><div id="iv-tbl" class="sp">'+tbl()+'</div></div>'+editPanel()+adjPanel()+histPanel()+orders()}

/* ---------- actions ---------- */
function closePanels(){INV.edit=null;INV.adj=null;INV.hist=null;INV.hdata=null;INV.err="";INV.f={}}
function busy(on){INV.busy=on;redraw()}
function saveRefresh(r,ok){if(r&&r.ok){INV.ok=ok;closePanels();return load()}INV.err=msg(r)+shortTxt(r)}
function onClick(e){var b=e.target.closest&&e.target.closest("[data-inv]");if(!b)return;var a=b.dataset.inv,id=b.dataset.id;
  if(a==="cart-clear"){INV.cart={};storeDraw();return}
  if(!X.isMgr())return;
  INV.ok="";
  if(a==="flt"){INV.flt=b.dataset.f;redraw()}
  else if(a==="new"){closePanels();INV.edit={id:null};redraw()}
  else if(a==="edit"){closePanels();INV.edit={id:id};redraw()}
  else if(a==="adj"){closePanels();INV.adj={id:id};INV.f.a_mode="receive";redraw()}
  else if(a==="cancel"){closePanels();redraw()}
  else if(a==="hist"){closePanels();INV.hist={id:id};INV.hdata=null;redraw();X.rpc("staff_part_history",id==="all"?{p_limit:200}:{p_part:id,p_limit:200}).then(function(r){if(r&&r.ok===false)throw new Error(r.message);INV.hdata=r;redraw()}).catch(function(er){X.authErr(er);INV.err=er.message||"Could not load history.";redraw()})}
  else if(a==="save"){var p=(ST.parts||[]).filter(function(x){return x.id===INV.edit.id})[0]||{};
    function g(k,d){return INV.f["e_"+k]!=null?INV.f["e_"+k]:d}
    var tr=INV.f.e_track!=null?!!INV.f.e_track:!!p.track_stock;
    var pay={id:INV.edit.id||"",name:g("name",p.name||""),price:g("price",p.price==null?"":p.price),category:g("category",p.category||""),sku:g("sku",p.sku||""),track_stock:tr,low_stock_level:g("low",p.low_stock_level||0),image_url:g("img",p.image_url||""),description:g("desc",p.description||""),sort:+g("sort",p.sort||0)||0,active:INV.f.e_act!=null?!!INV.f.e_act:p.active!==false};
    if(!INV.edit.id&&tr)pay.stock_qty=g("open","0");
    INV.err="";busy(true);X.rpc("staff_save_part",{p:pay}).then(function(r){return saveRefresh(r,"Part saved")}).catch(function(er){X.authErr(er);INV.err=er.message||"Not saved."}).then(function(){busy(false)})}
  else if(a==="adj-save"){var A={part_id:INV.adj.id,mode:fv("a_mode","receive"),quantity:fv("a_q",""),reason:fv("a_r","")};
    INV.err="";busy(true);X.rpc("staff_adjust_stock",{p:A}).then(function(r){return saveRefresh(r,"Stock updated")}).catch(function(er){X.authErr(er);INV.err=er.message||"Not saved."}).then(function(){busy(false)})}
  else if(a==="del"){if(!confirm("Delete this part? Parts with job, order or stock history cannot be deleted; hide them instead."))return;busy(true);X.rpc("staff_delete_part",{p_id:id}).then(function(r){return saveRefresh(r,"Part deleted")}).catch(function(er){X.authErr(er);INV.err=er.message||"Not deleted."}).then(function(){busy(false)})}
  else if(a==="order-set"){var sel=document.getElementById("iv-os-"+id);if(!sel)return;INV.err="";busy(true);X.rpc("staff_set_part_order",{p_id:id,p_status:sel.value}).then(function(r){if(r&&r.ok){INV.ok="Order updated";return load()}INV.err=msg(r)+shortTxt(r)}).catch(function(er){X.authErr(er);INV.err=er.message||"Not updated."}).then(function(){busy(false)})}}
function onInput(e){var t=e.target;
  if(t.dataset&&t.dataset.ivCart!==undefined){var n=Math.max(0,parseInt(t.value,10)||0),p=(ST.parts||[]).filter(function(x){return x.id===t.dataset.ivCart})[0];if(p&&p.track_stock&&n>p.stock_qty)n=p.stock_qty;INV.cart[t.dataset.ivCart]=n;if(String(n)!==t.value)t.value=n;cartDraw();return}

 d=r2(d);return{parts:r2(p),labour:r2(lb),charges:r2(c),base:base,disc:d,total:r2(base-d),miss:miss}}

  lines=IV.ed.lines.map(function(l){return{kind:l.kind,description:l.description,quantity:num(l.quantity),unit_price:has(l.unit_price)?num(l.unit_price):null,percent:l.pc?num(l.percent):null,line_total:lineAmt(l,c.base)||0}});
  tot={parts_total:c.parts,labour_total:c.labour,charges_total:c.charges,discount_total:c.disc,total:c.total,paid_total:0,balance:c.total}}
 else{lines=r.lines;tot={parts_total:i.parts_total,labour_total:i.labour_total,charges_total:i.charges_total,discount_total:i.discount_total,total:i.total,paid_total:i.paid_total,balance:i.balance}}

 var net=!m||/failed to fetch|networkerror|load failed|network request|timeout/i.test(m)||(e&&e.name==="TypeError");
 try{console.error("[AG] "+n+" failed:",e)}catch(x){}
 return{ok:false,error:net?"network":"api",message:net?"Could not reach the server. Check your connection and try again.":m}})}

 '.lv-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.lv-box{border:1px solid rgba(128,128,128,.35);border-radius:10px;padding:14px;margin-top:14px}.lv-box h4{margin:0 0 8px}'+

 document.head.appendChild(s)}

/* ---------- data ---------- */
function loadAll(){
 if(!active())return Promise.resolve();var mgr=X.isMgr();
 var jobs=[call("leave_list",{p:mgr?{mine:true,status:"all"}:{status:"all"}})];
 if(mgr)jobs.push(call("leave_list",{p:{status:L.flt,q:L.q||null}}));
 return Promise.all(jobs).then(function(a){
  L.mine=a[0]&&a[0].ok?a[0].rows:[];L.today=a[0]&&a[0].ok?a[0].today:L.today;
  if(mgr){L.all=a[1]&&a[1].ok?a[1].rows:[];L.sum=a[1]&&a[1].ok?a[1].summary:null;if(a[1]&&!a[1].ok)L.err=msg(a[1])}
  else if(a[0]&&!a[0].ok)L.err=msg(a[0]);
  L.loaded=true;buildNf()})}
function openDet(id){return call("leave_get",{p_id:id}).then(function(r){if(!r||!r.ok){L.err=msg(r);return}L.det=r;L.open=id;L.cx={ack:false};L.f.note=""})}
function done(okText,id){L.ok=okText||"";L.err="";pollNf(true);return loadAll().then(function(){return id?openDet(id):0}).then(draw)}
function act(name,args,okText,keep){if(L.busy)return;L.busy=true;L.ok="";L.err="";
 call(name,args).then(function(r){L.busy=false;
  if(!r||r.ok===false){L.err=msg(r);if(r&&r.error==="conflicts_need_ack"){L.det=L.det||{};L.det.conflicts=r.conflicts;L.cx={ack:false,need:true}}draw();return}
  return done(okText,keep&&L.open).then(function(){return L.open&&!keep?(L.open=null,L.det=null,draw()):0})})}

/* ---------- notifications for the bell (read state is per device, like the others) ---------- */
function buildNf(){var out=[],mgr=X.isMgr(),uid=ST.me&&ST.me.user_id,cut=Date.now()-30*864e5;
 if(mgr&&L.all!==null){/* needs-action rows are loaded when the filter is needs_action; otherwise use summary only */}
 (L.nfRows||[]).forEach(function(r){
  if(mgr&&r.user_id!==uid){
   if(r.status==="pending")out.push({t:r.created_at,title:"Leave request",text:r.user_name+" · "+range(r),href:"#loa"});
   if(r.status==="approved"&&r.cancel_requested_at)out.push({t:r.cancel_requested_at,title:"Leave cancellation requested",text:r.user_name+" · "+range(r),href:"#loa"});
  }
  if(r.user_id===uid){
   if(r.decided_at&&new Date(r.decided_at)>cut)out.push({t:r.decided_at,title:"Leave "+(r.status==="declined"?"declined":"approved"),text:range(r)+(r.decision_note?" · "+r.decision_note:""),href:"#loa"});
   if(r.cancel_decided_at&&new Date(r.cancel_decided_at)>cut)out.push({t:r.cancel_decided_at,title:"Leave cancellation "+r.cancel_decision,text:range(r)+(r.cancel_decision_note?" · "+r.cancel_decision_note:""),href:"#loa"});
  }});
 L.nf=out}
function pollNf(force){if(!active())return;if(!force&&Date.now()-L.lastNf<60000)return;L.lastNf=Date.now();
 call("leave_list",{p:{status:"all"}}).then(function(r){if(!r||!r.ok)return;L.nfRows=r.rows;buildNf();try{window.AGTB&&window.AGTB.draw(true)}catch(e){}})}
setInterval(function(){pollNf(false)},5000);

/* ---------- calendar and mechanic availability (approved leave only) ---------- */
function need(from,to){var c=L.cache;if(!active()||c.busy)return;
 for(var i=0;i<c.cov.length;i++)if(c.cov[i][0]<=from&&c.cov[i][1]>=to)return;
 var f=new Date(Date.parse(from+"T12:00:00Z")-30*864e5).toISOString().slice(0,10),t=new Date(Date.parse(to+"T12:00:00Z")+30*864e5).toISOString().slice(0,10);
 if(Date.parse(t)-Date.parse(f)>118*864e5)t=new Date(Date.parse(f)+118*864e5).toISOString().slice(0,10);
 c.busy=true;call("leave_calendar",{p_from:f,p_to:t}).then(function(r){c.busy=false;
  /* always record what was asked for so a failure or a clamped range can never trigger the same request again (it caused a redraw loop) */
  c.cov.push([from,to]);if(!r||!r.ok)return;
  var before=JSON.stringify(c.rows);
  c.rows=c.rows.filter(function(x){return!(x.to_date>=f&&x.from_date<=t)}).concat(r.leave);c.cov.push([f,t]);
  if(JSON.stringify(c.rows)===before)return;
  try{if(window.AGSCHED&&document.getElementById("cl"))X.calRender();else X.render()}catch(e){}})}
function invalidate(){L.cache.cov=[]}
function on(k,uid){return L.cache.rows.filter(function(r){return r.from_date<=k&&r.to_date>=k&&(!uid||r.user_id===uid)})}
/* label for the mechanic picker: " · on leave" when approved leave covers the booking day */
function tag(uid,b){var iso=b&&(b.scheduled_at||b.proposed_at||b.preferred_at);if(!iso)return"";var k;try{k=X.wallParts(iso,ST.tz||"UTC").d}catch(e){return""}
 if(!k)return"";need(k,k);return on(k,uid).length?" · on leave that day":""}

/* ---------- page ---------- */
function dayCountNote(){return'<p class="note">Leave is for whole days in the workshop time zone ('+esc(ST.tz||"UTC")+'). Approved leave stops you being assigned appointments on those days. Existing bookings are not moved automatically: a manager reviews any clash.</p>'}
function formHtml(){var min=L.today||new Date().toISOString().slice(0,10);
 return'<div class="card">'+X.sec("✈","Leave of absence","Ask for time away and follow the decision")+(L.err&&!L.open?'<div class="jb-err" role="alert">'+esc(L.err)+'</div>':"")+(L.ok&&!L.open?'<div class="bk-note good" role="status">'+esc(L.ok)+'</div>':"")+

  '<label for="lv-reason">Reason</label><textarea id="lv-reason" data-lvf="reason" maxlength="500" rows="3" placeholder="A short reason for the managers">'+esc(fv("reason"))+'</textarea>'+dayCountNote()+
  '<div class="lv-btns"><button data-lv="submit"'+(L.busy?" disabled":"")+'>Submit request</button></div></div>'}
function histNote(r){var h="";
 if(r.decision_note&&r.status!=="pending")h+='<small>'+esc(r.decided_by_name||"A manager")+': “'+esc(r.decision_note)+'”</small>';
 if(r.cancel_requested_at)h+='<small>Cancellation requested '+esc(X.ft(r.cancel_requested_at))+(r.cancel_reason?": "+esc(r.cancel_reason):"")+'. Waiting for a manager.</small>';
 if(r.cancel_decision==="declined"&&r.cancel_decision_note)h+='<small>Cancellation declined by '+esc(r.cancel_decided_by_name||"a manager")+': “'+esc(r.cancel_decision_note)+'”</small>';
 if(r.cancel_decision==="approved")h+='<small>Cancellation approved by '+esc(r.cancel_decided_by_name||"a manager")+'.</small>';return h}
function mineHtml(){var rows=L.mine||[],today=L.today||"";
 var h='<div class="card sp"><h3 class="hd" style="font-size:26px;margin-bottom:6px">My requests</h3>';
 if(!rows.length)return h+'<p class="note">You have not requested any leave yet.</p></div>';
 h+=rows.map(function(r){var past=r.to_date<today,ask=L.cx&&L.cx.ask===r.id;
  return'<div class="lv-row"><div class="lv-head"><div><b>'+esc(range(r))+'</b> <small style="display:inline">('+days(r)+')</small></div>'+stPill(r)+'</div><small>Reason: '+esc(r.reason)+'</small>'+histNote(r)+
   (r.status==="pending"?'<div class="lv-btns"><button class="alt sm" data-lv="cancel" data-id="'+esc(r.id)+'">Cancel request</button></div>':"")+
   (r.status==="approved"&&!r.cancel_requested_at&&!past?(ask?'<label for="lv-cr">Why do you need to cancel? (a manager must approve)</label><input id="lv-cr" data-lvf="cr" maxlength="500" value="'+esc(fv("cr"))+'"><div class="lv-btns"><button class="alt sm" data-lv="askgo" data-id="'+esc(r.id)+'">Send cancellation request</button><button class="alt sm" data-lv="askno">Never mind</button></div>':'<div class="lv-btns"><button class="alt sm" data-lv="ask" data-id="'+esc(r.id)+'">Request cancellation</button></div>'):"")+'</div>'}).join("");
 return h+'</div>'}
function mgrHtml(){var s=L.sum||{},rows=L.all||[],uid=ST.me&&ST.me.user_id;
 function chip(n,l,f){return'<button type="button" class="alt iv-chip'+(L.flt===f?" on":"")+'" data-lv="flt" data-f="'+f+'"><b>'+(n==null?"":n)+'</b> '+l+'</button>'}
 var h='<div class="card sp"><h3 class="hd" style="font-size:26px;margin-bottom:6px">Team leave</h3><div class="iv-chips">'+
  chip((s.pending||0)+(s.cancel_requests||0),"need a decision","needs_action")+chip(s.pending||0,"pending","pending")+chip(s.cancel_requests||0,"cancellation requests","cancel_requested")+chip(s.upcoming||0,"upcoming approved","upcoming")+'<span class="pill">On leave today <b>'+(s.on_leave_today||0)+'</b></span>'+chip("","all","all")+'</div>'+
  '<div class="lv-tools sp"><div><label for="lv-q">Search</label><input id="lv-q" type="search" data-lvq="q" placeholder="Name or reason" value="'+esc(L.q)+'"></div><div></div><div><button class="alt" data-lv="search">Search</button></div></div>';
 h+=rows.length?'<div class="tw sp"><table><tr><th>Employee</th><th>Dates</th><th>Reason</th><th>Status</th><th>Booking clashes</th><th></th></tr>'+rows.map(function(r){
   return'<tr><td><b>'+esc(r.user_name)+'</b>'+(r.user_id===uid?' <em class="you">You</em>':"")+'</td><td>'+esc(range(r))+'<br><small>'+days(r)+'</small></td><td>'+esc(r.reason)+'</td><td>'+stPill(r)+'</td><td>'+(r.conflict_count?'<span class="pill lv-pending">'+r.conflict_count+' to review</span>':"—")+'</td><td><button class="alt sm" data-lv="open" data-id="'+esc(r.id)+'">Review</button></td></tr>'}).join("")+'</table></div>':'<div class="empty sp">Nothing here.</div>';
 return h+'</div>'}
function detailHtml(){var d=L.det;if(!d||!d.leave)return"";var r=d.leave,conf=d.conflicts||[],own=ST.me&&r.user_id===ST.me.user_id,cr=r.status==="approved"&&r.cancel_requested_at;
 var h='<div class="card sp" id="lv-detail"><div class="lv-head"><h3 class="hd" style="font-size:26px;margin:0">'+esc(r.user_name)+' · '+esc(range(r))+'</h3><div>'+stPill(r)+' <button class="alt sm" data-lv="close">Close</button></div></div>'+
  (L.err?'<div class="jb-err" role="alert">'+esc(L.err)+'</div>':"")+(L.ok?'<div class="bk-note good" role="status">'+esc(L.ok)+'</div>':"")+
  '<p><b>'+days(r)+'</b> · requested '+esc(X.ft(r.created_at))+'</p><p><b>Reason:</b> '+esc(r.reason)+'</p>';
 if(conf.length)h+='<div class="lv-box"><h4>'+conf.length+' booking'+(conf.length===1?"":"s")+' assigned to '+esc(r.user_name)+' fall inside these dates</h4><div class="tw"><table><tr><th>Booking</th><th>Customer</th><th>When</th><th>Status</th><th></th></tr>'+conf.map(function(c){return'<tr><td><b>'+esc(c.reference)+'</b></td><td>'+esc(c.customer)+'</td><td>'+esc(X.ft(c.starts))+'</td><td>'+esc(X.STAT[c.status]||c.status)+'</td><td><button class="alt sm" data-lv="gobook" data-id="'+esc(c.booking_id)+'">Open booking</button></td></tr>'}).join("")+'</table></div><p class="note">These bookings are not changed automatically. Reassign or reschedule them from the booking.</p></div>';
 var can=d.can_decide&&(r.status==="pending"||cr);
 if(own&&(r.status==="pending"||cr)&&X.isMgr())h+='<p class="note">You cannot decide your own request. Another manager must review it.</p>';
 if(can){h+='<div class="lv-box"><h4>'+(cr?"Cancellation request: "+esc(r.cancel_reason||""):"Decision")+'</h4><label for="lv-note">Note to the employee'+(cr?" (required to keep the leave)":" (required to decline)")+'</label><textarea id="lv-note" data-lvf="note" maxlength="500" rows="2">'+esc(fv("note"))+'</textarea>';
  if(!cr&&conf.length)h+='<label class="lv-ack"><input type="checkbox" data-lvf="ack" '+(L.cx&&L.cx.ack?"checked":"")+'> I have seen the '+conf.length+' clashing booking'+(conf.length===1?"":"s")+'. They stay assigned and I will review them.</label>';
  h+='<div class="lv-btns">'+(cr?'<button data-lv="cdec" data-d="approve">Approve cancellation</button><button class="alt" data-lv="cdec" data-d="decline">Keep the leave</button>':'<button data-lv="dec" data-d="approve"'+(L.busy?" disabled":"")+'>Approve</button><button class="alt" data-lv="dec" data-d="decline">Decline</button>')+'</div></div>'}
 var ev=d.events||[];h+='<div class="lv-box"><h4>History</h4><ol class="bk-tl">'+ev.slice().reverse().map(function(e){return'<li><b>'+esc(EVL[e.action]||e.action)+'</b><small>'+esc(X.ft(e.at))+' · '+esc(e.actor_name)+'</small>'+(e.note?'<span>'+esc(e.note)+'</span>':"")+'</li>'}).join("")+'</ol></div></div>';

 if(!X.hasSession()){el.innerHTML='<div class="card">'+X.sec("✈","Leave of absence","Sign in to request leave")+'<p class="note">Sign in on the Bookings page with your staff account.</p><a class="btn" href="#bookings">Go to sign in</a></div>';return}
 if(ST.me===undefined||!L.loaded){el.innerHTML='<div class="card"><div class="sk" style="height:200px"></div></div>';return}
 if(!ST.me||!ST.me.active){el.innerHTML='<div class="card">'+X.sec("✈","Leave of absence","Active staff only")+'<p class="note">Your account is not active, so leave cannot be requested.</p></div>';return}

window.V=window.V||{};window.V.loa=function(){setTimeout(mount,0);return'<div id="lv"></div>'};
(function(){var h=(location.hash||"").slice(1).split("/")[0];if(h==="loa")setTimeout(function(){try{window.dispatchEvent(new Event("hashchange"))}catch(e){}},0)})();

document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest("[data-lv]");if(!t)return;var a=t.getAttribute("data-lv"),id=t.getAttribute("data-id");

  case"submit":if(L.busy)break;L.busy=true;L.err="";L.ok="";call("leave_submit",{p:{from:L.f.from||null,to:L.f.to||null,reason:L.f.reason||""}}).then(function(r){L.busy=false;
    if(!r||r.ok===false){L.err=msg(r);draw();return}L.f={};invalidate();return done("Request sent. A manager will review it and you will be notified here.")});break;
  case"cancel":act("leave_cancel",{p:{id:id}},"Request cancelled.");break;
  case"ask":L.cx={ask:id};L.f.cr="";draw();break;case"askno":L.cx=null;draw();break;
  case"askgo":L.busy=false;if(!L.f.cr||L.f.cr.trim().length<3){L.err="Give a short reason for cancelling approved leave.";draw();break}
    act("leave_cancel",{p:{id:id,reason:L.f.cr}},"Cancellation requested. Your leave stays in place until a manager approves.");L.cx=null;break;
  case"flt":L.flt=t.getAttribute("data-f");L.open=null;L.det=null;loadAll().then(draw);break;

  case"cdec":{var cc=t.getAttribute("data-d");act("leave_decide_cancel",{p:{id:L.open,decision:cc,note:L.f.note||null}},cc==="approve"?"Cancellation approved. The leave is cancelled.":"Cancellation declined. The leave stays in place.",true);invalidate();break}
  case"gobook":ST.open=id;ST.filter="all";ST.dtab="overview";location.hash="#bookings";break}});

})();

/* ---------- images: resize in the browser, upload to the site-media bucket ---------- */
function prep(file){return new Promise(function(res,rej){
 if(!file)return rej(new Error("Choose a photograph first."));
 if(!/^image\/(jpeg|png|webp)$/.test(file.type))return rej(new Error("Choose a JPG, PNG or WebP image."));
 if(file.size>25e6)return rej(new Error("That image is larger than 25 MB."));
 var u=URL.createObjectURL(file),im=new Image();
 im.onload=function(){var m=1920,r=Math.min(1,m/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r)),c=document.createElement("canvas");c.width=w;c.height=h;
  var x=c.getContext("2d");x.fillStyle="#111";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
  c.toBlob(function(b){b?res(b):rej(new Error("Could not process that image."))},"image/jpeg",.86)};
 im.onerror=function(){URL.revokeObjectURL(u);rej(new Error("That file could not be read as an image."))};im.src=u})}
function enc(p){return p.split("/").map(encodeURIComponent).join("/")}
function put(path,blob){return X.token().then(function(t){return fetch(X.base+"/storage/v1/object/site-media/"+enc(path),{method:"POST",headers:{apikey:X.key,Authorization:"Bearer "+t,"Content-Type":"image/jpeg","x-upsert":"false","cache-control":"31536000"},body:blob})})
 .then(function(r){if(r.ok)return;return r.text().then(function(t){var m="";try{m=JSON.parse(t).message}catch(e){}
  throw new Error(r.status===401||r.status===403?"You do not have permission to upload photographs.":"The photograph could not be uploaded"+(m?" ("+m+")":"")+".")})})}
function rm(paths){return X.token().then(function(t){return Promise.all(paths.filter(Boolean).map(function(p){return fetch(X.base+"/storage/v1/object/site-media/"+enc(p),{method:"DELETE",headers:{apikey:X.key,Authorization:"Bearer "+t}}).catch(function(){})}))}).catch(function(){})}
function upFile(inputId,folder){var f=document.getElementById(inputId);f=f&&f.files&&f.files[0];if(!f)return Promise.resolve(null);
 var path=folder+"/"+uid()+".jpg";return prep(f).then(function(b){return put(path,b)}).then(function(){return path})}

/* ---------- data ---------- */
function load(){return call("site_manage_get",{}).then(function(r){
 if(r&&r.ok===false){S.err=r.message||"Could not load the website content.";S.D=S.D||null;return}
 S.D=r;S.err=""})}
function mgr(){return X.hasSession()&&ST.me&&ST.me.active&&ST.me.role==="manager"}
function done(ok,m){S.busy=false;if(ok){S.msg=m;S.err=""}else{S.err=m;S.msg=""}}
function act(fn,okMsg){if(S.busy)return;S.busy=true;S.msg="";S.err="";stDraw();
 Promise.resolve().then(fn).then(function(r){
  if(r&&r.ok===false){done(false,r.message||"That was not allowed.");stDraw();return}
  return load().then(function(){done(true,okMsg);S.open=S.keepOpen||null;S.keepOpen=null;draw()})
 }).catch(function(e){done(false,(e&&e.message)||"Something went wrong.");stDraw()})}
function pill(t,c){return'<span class="pill'+(c?" "+c:"")+'">'+esc(t)+'</span>'}
function ck2(id,label,on){return'<div class="sw-ck"><input type="checkbox" id="'+id+'"'+(on?" checked":"")+'><label for="'+id+'">'+esc(label)+'</label></div>'}
function fld(id,label,val,extra){return'<label for="'+id+'">'+esc(label)+'</label><input id="'+id+'" value="'+esc(val==null?"":val)+'" '+(extra||"")+'>'}
function area(id,label,val,rows,max){return'<label for="'+id+'">'+esc(label)+'</label><textarea id="'+id+'" rows="'+(rows||3)+'"'+(max?' maxlength="'+max+'"':"")+'>'+esc(val==null?"":val)+'</textarea>'}
