/* ---------- helpers ---------- */
var $b=function(s){return document.querySelector(s)};
var val=function(id){var e=document.getElementById(id);return e?e.value.trim():""};
function ft(d){if(!d)return"—";var x=new Date(d);return isNaN(x)?"—":x.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})}
function iso(local){if(!local)return null;var x=new Date(local);return isNaN(x)?null:x.toISOString()}
function say(m){if(window.toast)window.toast(m)}
function isMgr(){return ST.me&&ST.me.role==="manager"}
function nameOf(uid){if(!uid)return"";var s=ST.staff.filter(function(x){return x.user_id===uid})[0];return s?s.display_name:(ST.me&&ST.me.user_id===uid?ST.me.display_name:"a mechanic")}
function authErr(e){if(e&&e.message==="auth"){ST.me=undefined;ST.err="Your session has ended. Please sign in again.";return}ST.err=(e&&e.message)||"Something went wrong."}
function filters(){return isMgr()?MGR_FILTERS:MECH_FILTERS}
function curFilter(){var f=filters();if(!ST.filter||!f.some(function(x){return x[0]===ST.filter}))ST.filter=f[0][0];return f.filter(function(x){return x[0]===ST.filter})[0]}
function pill(s){return'<span class="pill bk-s bk-'+esc(s)+'">'+esc(STAT[s]||s)+'</span>'}

/* ---------- data ---------- */
function loadList(){return api("bookings?select="+COLS+"&order=created_at.desc&limit=500").then(function(r){ST.list=r||[]})}
function loadStaff(){return api("staff_profiles?select=user_id,display_name,role,active&order=display_name").then(function(r){ST.staff=r||[]})}
function loadEvents(id){return api("booking_events?select=id,action,actor_type,actor_name,message,internal,at&booking_id=eq."+encodeURIComponent(id)+"&order=at.asc,id.asc").then(function(r){ST.events[id]=r||[]})}
function loadInvites(){return api("staff_invites?select=id,role,label,created_at,expires_at,used_at&order=created_at.desc&limit=50").then(function(r){ST.invites=r||[]})}
function loadSettings(){return api("site_settings?select=location_text,map_url,hours_text,contact_text,discord_url&id=eq.1").then(function(r){ST.settings=(r&&r[0])||{}})}
function boot(){if(ST.booting)return;ST.booting=true;ST.err="";
  rpc("staff_me").then(function(m){ST.me=m;if(m&&m.active)return Promise.all([loadList(),m.role==="manager"?loadStaff():0])})
   .catch(authErr).then(function(){ST.booting=false;render()});}
function refresh(id){var jobs=[loadList()];if(id)jobs.push(loadEvents(id));if(isMgr())jobs.push(loadStaff());
  return Promise.all(jobs).catch(authErr).then(render)}

/* ---------- views ---------- */
function authHtml(){var up=ST.authMode==="up";
  return'<div class="card bk-narrow">'+sec("✉","Staff sign-in","Atomic Garage staff only")+
  '<div class="bk-tabs"><button type="button" class="'+(up?"alt":"")+'" data-bk="mode" data-m="in">Sign in</button><button type="button" class="'+(up?"":"alt")+'" data-bk="mode" data-m="up">Create account</button></div>'+
  '<form data-bkform="'+(up?"signup":"signin")+'" novalidate><label for="bk-email">Email</label><input id="bk-email" type="email" autocomplete="username" maxlength="120" value="'+esc(ST.email||"")+'" required>'+
  '<label for="bk-pass">Password'+(up?" (8+ characters)":"")+'</label><input id="bk-pass" type="password" autocomplete="'+(up?"new-password":"current-password")+'" maxlength="100" required>'+
  '<div id="bk-err" class="bk-note bad" role="alert"'+(ST.err?"":" hidden")+'>'+esc(ST.err)+'</div><div id="bk-info" class="bk-note" role="status"'+(ST.info?"":" hidden")+'>'+esc(ST.info)+'</div>'+
  '<div class="sp"><button type="submit">'+(up?"Create account":"Sign in")+'</button></div></form>'+
  '<p class="note">'+(up?"After creating an account you will be asked for the staff access code a manager gave you. An account without one cannot see anything.":"New staff: create an account first, then enter your access code.")+'</p></div>'}
function redeemHtml(){return'<div class="card bk-narrow">'+sec("★","Staff access code","Enter the code a manager gave you")+
  '<form data-bkform="redeem" novalidate><label for="bk-name">Your name (as shown to colleagues)</label><input id="bk-name" maxlength="60" autocomplete="off">'+
  '<label for="bk-code">Access code</label><input id="bk-code" maxlength="40" autocomplete="off" placeholder="AG-XXXXXXXXXXXXXXXXXXXX" style="text-transform:uppercase">'+
  '<div id="bk-err" class="bk-note bad" role="alert"'+(ST.err?"":" hidden")+'>'+esc(ST.err)+'</div>'+
  '<div class="sp"><button type="submit">Activate staff access</button> <button type="button" class="alt" data-bk="signout">Sign out</button></div></form></div>'}
function inactiveHtml(){return'<div class="card bk-narrow">'+sec("⛔","Access disabled","This staff account is not active")+'<p class="note">A manager has deactivated your staff access. Ask them to restore it.</p><div class="sp"><button class="alt" data-bk="signout">Sign out</button></div></div>'}
function chips(){var f=filters(),cur=curFilter()[0];
  return'<div class="bk-chips" role="group" aria-label="Filter bookings">'+f.map(function(x){var n=x[2]?ST.list.filter(function(b){return x[2].indexOf(b.status)>=0}).length:ST.list.length;
    return'<button type="button" class="sm '+(x[0]===cur?"":"alt")+'" data-bk="filter" data-f="'+x[0]+'" aria-pressed="'+(x[0]===cur)+'">'+esc(x[1])+' <b>'+n+'</b></button>'}).join("")+'</div>'}
function appHtml(){var mgr=isMgr();
  var h='<div class="card bk-bar"><div class="bk-top"><div><b>'+esc(ST.me.display_name)+'</b> <span class="pill a">'+(mgr?"Manager":"Mechanic")+'</span></div><div class="bk-btns"><button class="alt sm" data-bk="reload">Refresh</button><button class="alt sm" data-bk="signout">Sign out</button></div></div>';
  if(mgr)h+='<div class="bk-tabs"><button type="button" class="'+(ST.tab==="bookings"?"":"alt")+'" data-bk="tab" data-t="bookings">Bookings</button><button type="button" class="'+(ST.tab==="team"?"":"alt")+'" data-bk="tab" data-t="team">Team and site settings</button></div>';
  h+='</div>';
  if(ST.err)h+='<div class="bk-note bad" role="alert">'+esc(ST.err)+'</div>';
  return h+(mgr&&ST.tab==="team"?teamHtml():listHtml())}
function listHtml(){var f=curFilter(),rows=f[2]?ST.list.filter(function(b){return f[2].indexOf(b.status)>=0}):ST.list;
  var head=sec("✉","Bookings",isMgr()?"Review requests, propose times, assign mechanics":"Jobs assigned to you");
  var body=rows.length?rows.map(cardHtml).join(""):'<div class="empty">'+(ST.list.length?"Nothing in this view.":(isMgr()?"No bookings yet. Requests from the public website appear here as Pending.":"No bookings are assigned to you yet. A manager will assign work to you."))+'</div>';
  return'<div class="card">'+head+chips()+'<div class="bk-list">'+body+'</div></div>'}
function cardHtml(b){var open=ST.open===b.id;
  return'<article class="bk-card'+(open?" open":"")+'"><div class="bk-row"><div class="bk-main"><b class="bk-ref">'+esc(b.reference)+'</b> '+pill(b.status)+
   '<div class="bk-sub">'+esc(SVC[b.service_type]||b.service_type)+' · '+esc(b.vehicle)+' · '+esc(b.character_name)+'</div>'+
   '<div class="bk-sub">'+(b.status==="approved"||b.status==="in_progress"||b.status==="completed"?"Appointment <b>"+esc(ft(b.scheduled_at))+"</b>":"Requested "+esc(ft(b.preferred_at)))+
   (b.status==="alternative_proposed"||b.status==="alternative_accepted"?" · Proposed <b>"+esc(ft(b.proposed_at))+"</b>":"")+
   (b.assigned_to?" · Mechanic: "+esc(nameOf(b.assigned_to)):"")+'</div></div>'+
   '<button class="alt sm" data-bk="toggle" data-id="'+esc(b.id)+'" aria-expanded="'+open+'">'+(open?"Close":"Open")+'</button></div>'+(open?detailHtml(b):"")+'</article>'}
function detailHtml(b){var ev=ST.events[b.id];
  var dl='<dl class="bk-dl">'+[["Character",b.character_name],["Contact (in-character)",b.contact],["Vehicle",b.vehicle],["Registration",b.vehicle_reg],["Service",SVC[b.service_type]||b.service_type],
   ["Requested time",ft(b.preferred_at)],["Proposed time",b.proposed_at?ft(b.proposed_at):""],["Approved appointment",b.scheduled_at&&(b.status==="approved"||b.status==="in_progress"||b.status==="completed")?ft(b.scheduled_at):""],
   ["Submitted",ft(b.created_at)],["Work requested",b.description],["Message shown to customer",b.customer_message]].filter(function(x){return x[1]}).map(function(x){return"<dt>"+esc(x[0])+"</dt><dd>"+esc(x[1])+"</dd>"}).join("")+"</dl>";
  var tl=ev?'<h3 class="hd bk-h3">History</h3><ol class="bk-tl">'+ev.map(function(e){return'<li class="'+(e.internal?"int":"")+'"><b>'+esc(EVT[e.action]||e.action)+'</b>'+(e.internal?' <span class="pill">Staff only</span>':"")+'<small>'+esc(ft(e.at))+(e.actor_name?" · "+esc(e.actor_name):"")+'</small>'+(e.message?'<span>'+esc(e.message)+'</span>':"")+'</li>'}).join("")+'</ol>':'<div class="sk" style="height:80px"></div>';
  return'<div class="bk-detail">'+dl+actionsHtml(b)+tl+'</div>'}
function arm(key,label,extra){var on=ST.armed===key;return'<button type="button" class="alt sm'+(on?" bk-danger":"")+'" data-bk="'+(on?"act":"arm")+'" data-act="'+key.split(":")[0]+'"'+(extra||"")+' data-key="'+esc(key)+'">'+(on?"Click again to confirm":label)+'</button>'}
function actionsHtml(b){var mgr=isMgr(),s=b.status,closed=CLOSED.indexOf(s)>=0,h="";
  if(closed)return mgr?noteHtml(b):'<p class="note">This booking is closed.</p>'+noteHtml(b);
  if(mgr&&(s==="pending"||s==="alternative_accepted"||s==="alternative_proposed"))
    h+='<div class="bk-grp"><h3 class="hd bk-h3">Decision</h3><label for="bk-msg">Message to customer (optional, shown on their tracking page)</label><textarea id="bk-msg" maxlength="500"></textarea><div class="bk-btns sp">'+
      (s==="pending"?'<button data-bk="act" data-act="approve">Approve requested time</button>':"")+(s==="alternative_accepted"?'<button data-bk="act" data-act="approve">Approve the time they accepted</button>':"")+
      arm("decline","Decline request")+'</div>'+
      '<label for="bk-when">Propose a different time (your local time)</label><div class="bk-inline"><input id="bk-when" type="datetime-local"><button class="alt" data-bk="act" data-act="propose">Propose time</button></div>'+
      '<p class="note">Nothing is confirmed to the customer until you approve. '+(s==="alternative_proposed"?"A time is already waiting for their reply.":"")+'</p></div>';
  if(mgr)h+='<div class="bk-grp"><h3 class="hd bk-h3">Assigned mechanic</h3><div class="bk-inline"><select id="bk-mech" aria-label="Mechanic"><option value="">Unassigned</option>'+
      ST.staff.filter(function(x){return x.active}).map(function(x){return'<option value="'+esc(x.user_id)+'"'+(x.user_id===b.assigned_to?" selected":"")+'>'+esc(x.display_name)+' ('+esc(x.role)+')</option>'}).join("")+
      '</select><button class="alt" data-bk="act" data-act="assign">Save assignment</button></div></div>';
  if(s==="approved"||s==="in_progress"){h+='<div class="bk-grp"><h3 class="hd bk-h3">Work status</h3><div class="bk-btns">'+
      (s==="approved"?'<button data-bk="act" data-act="set_status" data-status="in_progress">Start work</button>':"")+
      '<button data-bk="act" data-act="set_status" data-status="completed">Mark completed</button>'+
      (mgr&&s==="in_progress"?'<button class="alt" data-bk="act" data-act="set_status" data-status="approved">Back to approved</button>':"")+'</div></div>'}
  if(mgr)h+='<div class="bk-grp">'+arm("set_status:cancelled","Cancel this booking",' data-status="cancelled"')+'</div>';
  return h+noteHtml(b)}
function noteHtml(b){return'<div class="bk-grp"><h3 class="hd bk-h3">Internal note</h3><div class="bk-inline"><input id="bk-note" maxlength="500" placeholder="Visible to staff only" aria-label="Internal note"><button class="alt" data-bk="act" data-act="note">Add note</button></div></div>'}
function teamHtml(){
  var staff=ST.staff.length?'<div class="tw"><table><tr><th>Name</th><th>Role</th><th>Status</th><th></th></tr>'+ST.staff.map(function(s){
    return'<tr><td>'+esc(s.display_name)+(ST.me.user_id===s.user_id?' <em class="you">You</em>':"")+'</td><td><select id="bk-r-'+esc(s.user_id)+'" aria-label="Role for '+esc(s.display_name)+'"><option value="mechanic"'+(s.role==="mechanic"?" selected":"")+'>Mechanic</option><option value="manager"'+(s.role==="manager"?" selected":"")+'>Manager</option></select></td>'+
    '<td><select id="bk-a-'+esc(s.user_id)+'" aria-label="Status for '+esc(s.display_name)+'"><option value="1"'+(s.active?" selected":"")+'>Active</option><option value="0"'+(s.active?"":" selected")+'>Deactivated</option></select></td><td><button class="alt sm" data-bk="member" data-uid="'+esc(s.user_id)+'">Save</button></td></tr>'}).join("")+'</table></div>':'<div class="empty">No staff yet.</div>';
  var inv=ST.invites.length?'<div class="tw"><table><tr><th>For</th><th>Role</th><th>Expires</th><th>State</th><th></th></tr>'+ST.invites.map(function(i){var used=!!i.used_at,exp=new Date(i.expires_at)<new Date();
    return'<tr><td>'+esc(i.label||"—")+'</td><td>'+esc(i.role)+'</td><td>'+esc(ft(i.expires_at))+'</td><td>'+(used?"Used":exp?"Expired":"Waiting")+'</td><td>'+(used?"":'<button class="alt sm" data-bk="revoke" data-id="'+esc(i.id)+'">Remove</button>')+'</td></tr>'}).join("")+'</table></div>':'<div class="empty">No invitations yet.</div>';
  var s=ST.settings||{};
  return'<div class="card">'+sec("☰","Staff","Roles and access")+staff+'</div>'+
  '<div class="card sp">'+sec("+","Invite staff","Give the one-time code to the person privately. It expires in 7 days.")+
   '<div class="g g3"><div><label for="bk-inv-label">Who is it for?</label><input id="bk-inv-label" maxlength="60"></div><div><label for="bk-inv-role">Role</label><select id="bk-inv-role"><option value="mechanic">Mechanic</option><option value="manager">Manager</option></select></div></div>'+
   '<div class="sp"><button data-bk="invite">Create access code</button></div>'+
   (ST.newCode?'<div class="bk-note good" role="status"><b>Code (shown once):</b> <code class="bk-code">'+esc(ST.newCode)+'</code> <button class="alt sm" data-bk="copycode">Copy</button></div>':"")+
   '<div class="sp">'+inv+'</div></div>'+
  '<div class="card sp">'+sec("⌂","Public site details","Shown on the public Contact page. Leave a box empty to hide it.")+
   '<div class="g g2"><div><label for="bk-s-loc">Location</label><textarea id="bk-s-loc" maxlength="300" rows="3">'+esc(s.location_text||"")+'</textarea></div><div><label for="bk-s-hours">Opening hours</label><textarea id="bk-s-hours" maxlength="500" rows="3">'+esc(s.hours_text||"")+'</textarea></div>'+
   '<div><label for="bk-s-contact">Contact details</label><textarea id="bk-s-contact" maxlength="500" rows="3">'+esc(s.contact_text||"")+'</textarea></div><div><label for="bk-s-map">Map link (https)</label><input id="bk-s-map" maxlength="500" value="'+esc(s.map_url||"")+'"><label for="bk-s-discord">Discord link (https)</label><input id="bk-s-discord" maxlength="300" value="'+esc(s.discord_url||"")+'"></div></div>'+
   '<div class="sp"><button data-bk="settings">Save public details</button></div></div>'}
function render(){var h;
  if(!sess)h=authHtml();else if(ST.me===undefined)h=ST.err?'<div class="card bk-narrow">'+sec("\u26A0","Could not load bookings","")+'<div class="bk-note bad" role="alert">'+esc(ST.err)+'</div><div class="sp"><button data-bk="retry">Try again</button> <button class="alt" data-bk="signout">Sign out</button></div></div>':'<div class="sk" style="height:220px"></div>';else if(ST.me===null)h=redeemHtml();else if(!ST.me.active)h=inactiveHtml();else h=appHtml();
  var authed=!!(sess&&ST.me&&ST.me.active);
  document.body.classList.toggle("ag-in",authed);
  var g=$b("#bkg"),root=$b("#bk");
  if(g)g.innerHTML=authed?"":'<div class="ag-gate-brand">Atomic Garage<small>Staff portal</small></div>'+h;
  if(root)root.innerHTML=authed?h:""}

/* ---------- actions ---------- */
function doAct(id,action,extra){if(ST.busy)return;ST.busy=true;ST.err="";var p=extra||{},m=val("bk-msg");if(m)p.message=m;
  rpc("staff_booking_action",{p_id:id,p_action:action,p:p}).then(function(r){
    ST.busy=false;ST.armed=null;
    if(r&&r.ok){say("Saved");return refresh(id)}
    ST.err=(r&&r.message)||"That change was not allowed.";return refresh(id).then(function(){ST.err=(r&&r.message)||"";render()})
  }).catch(function(e){ST.busy=false;ST.armed=null;authErr(e);render()})}
function signOut(){var t=sess&&sess.access_token;saveSess(null);if(t)raw("/auth/v1/logout",{method:"POST",token:t}).catch(function(){});
  ST.me=undefined;ST.list=[];ST.staff=[];ST.events={};ST.open=null;ST.err="";ST.info="";ST.newCode=null;render()}
function submitForm(kind){ST.err="";ST.info="";
  if(kind==="signin"||kind==="signup"){var em=val("bk-email");ST.email=em;var pw=document.getElementById("bk-pass").value;
    if(!/^\S+@\S+\.\S+$/.test(em)){ST.err="Enter a valid email address.";return render()}
    if(pw.length<(kind==="signup"?8:1)){ST.err=kind==="signup"?"Use a password of at least 8 characters.":"Enter your password.";return render()}
    var p=kind==="signin"?authCall("password",{email:em,password:pw}):raw("/auth/v1/signup",{method:"POST",body:{email:em,password:pw}}).then(function(r){
      if(!r.ok)throw new Error((r.json&&(r.json.msg||r.json.message||r.json.error_description))||"Could not create the account");
      if(r.json&&r.json.access_token){saveSess({access_token:r.json.access_token,refresh_token:r.json.refresh_token,expires_at:Math.floor(Date.now()/1000)+(r.json.expires_in||3600)});return}
      ST.authMode="in";ST.info="Account created. If you were sent a confirmation email, confirm it first, then sign in here.";return"pending"});
    p.then(function(x){if(x==="pending"){render();return}ST.me=undefined;render();boot()}).catch(function(e){ST.err=e.message;render()});
  }else if(kind==="redeem"){
    rpc("staff_redeem_invite",{p_code:val("bk-code"),p_name:val("bk-name")}).then(function(r){
      if(r&&r.ok){say("Staff access activated");ST.me=undefined;render();boot()}else{ST.err=(r&&r.message)||"Could not activate.";render()}}).catch(function(e){authErr(e);render()})}}

document.addEventListener("submit",function(e){var f=e.target.closest&&e.target.closest("[data-bkform]");if(!f)return;e.preventDefault();submitForm(f.dataset.bkform)});
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-bk]");if(!b||!($b("#bk")||$b("#bkg")))return;var a=b.dataset.bk;
  if(a==="retry"){ST.err="";render();boot()}
  else if(a==="mode"){ST.authMode=b.dataset.m;ST.err="";ST.info="";render()}
  else if(a==="signout")signOut();
  else if(a==="reload"){ST.err="";refresh(ST.open).then(function(){if(isMgr()&&ST.tab==="team")return Promise.all([loadInvites(),loadSettings()]).then(render)}).catch(function(){})}
  else if(a==="tab"){ST.tab=b.dataset.t;ST.err="";ST.newCode=null;render();if(ST.tab==="team")Promise.all([loadStaff(),loadInvites(),loadSettings()]).then(render).catch(function(er){authErr(er);render()})}
  else if(a==="filter"){ST.filter=b.dataset.f;ST.open=null;ST.armed=null;render()}
  else if(a==="toggle"){var id=b.dataset.id;ST.armed=null;if(ST.open===id){ST.open=null;render()}else{ST.open=id;render();loadEvents(id).then(render).catch(function(er){authErr(er);render()})}}
  else if(a==="arm"){ST.armed=b.dataset.key;render();var k=ST.armed;setTimeout(function(){if(ST.armed===k){ST.armed=null;render()}},5000)}
  else if(a==="act"){var act=b.dataset.act,bid=ST.open,x={};if(!bid)return;
    if(act==="propose"){x.proposed_at=iso(val("bk-when"));if(!x.proposed_at){ST.err="Choose a date and time to propose.";return render()}}
    if(act==="assign")x.mechanic_id=val("bk-mech")||null;
    if(act==="set_status")x.status=b.dataset.status;
    if(act==="note"){x.message=val("bk-note");if(!x.message){ST.err="Write a note first.";return render()}}
    doAct(bid,act,x)}
  else if(a==="member"){var u=b.dataset.uid;rpc("staff_update_member",{p_user:u,p_role:val("bk-r-"+u),p_active:val("bk-a-"+u)==="1"}).then(function(r){if(r&&r.ok){say("Saved");return loadStaff()}ST.err=(r&&r.message)||"Not saved.";}).catch(authErr).then(render)}
  else if(a==="invite"){rpc("staff_create_invite",{p_role:val("bk-inv-role"),p_label:val("bk-inv-label")}).then(function(r){if(r&&r.ok){ST.newCode=r.code;return loadInvites()}ST.err=(r&&r.message)||"Could not create the code."}).catch(authErr).then(render)}
  else if(a==="revoke"){rpc("staff_revoke_invite",{p_id:b.dataset.id}).then(loadInvites).catch(authErr).then(render)}
  else if(a==="copycode"){var t=ST.newCode||"";(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){say("Copied")},function(){say("Select the code and copy it")})}
  else if(a==="settings"){var body={location_text:val("bk-s-loc")||null,hours_text:val("bk-s-hours")||null,contact_text:val("bk-s-contact")||null,map_url:val("bk-s-map")||null,discord_url:val("bk-s-discord")||null,updated_at:new Date().toISOString()};
    if((body.map_url&&!/^https:\/\//.test(body.map_url))||(body.discord_url&&!/^https:\/\//.test(body.discord_url))){ST.err="Links must start with https://";return render()}
    api("site_settings?id=eq.1",{method:"PATCH",body:body,prefer:"return=representation"}).then(function(r){if(r&&r.length===1){ST.settings=r[0];ST.err="";say("Public details saved")}else ST.err="Not saved. Only managers can change these."}).catch(authErr).then(render)}
});

/* ---------- hook into the existing portal router without touching it ---------- */
V.bookings=function(){setTimeout(function(){render();if(sess&&ST.me===undefined)boot()},0);return'<div id="bk"></div>'};
setInterval(function(){if(location.hash!=="#bookings"||!sess||!ST.me||!ST.me.active||ST.open||ST.busy||document.hidden||ST.tab!=="bookings")return;
